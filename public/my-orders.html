<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - ShopOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --slate-900: #0f172a;
            --bg: #f8fafc;
        }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg); color: #334155; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-32">
    <!-- Navbar -->
    <nav class="sticky top-0 z-40 glass border-b border-white/20">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <button onclick="window.location.href='/'" class="w-10 h-10 flex items-center justify-center bg-white rounded-xl shadow-sm border border-slate-100 text-slate-900 hover:bg-slate-900 hover:text-white transition-all duration-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </button>
            <h1 class="text-xs font-black uppercase tracking-widest text-slate-900">My Order History</h1>
            <div class="w-10"></div>
        </div>
    </nav>

    <div class="max-w-2xl mx-auto px-6 py-12">
        <div class="mb-12">
            <h2 class="text-4xl font-black text-slate-900 tracking-tight mb-2">My Orders</h2>
            <p class="text-slate-500 font-medium">Manage and track all your past purchases.</p>
        </div>

        <div id="orders-container" class="space-y-6">
            <!-- Loading State -->
            <div class="flex flex-col items-center justify-center py-20 text-slate-400">
                <div class="animate-spin rounded-full h-8 w-8 border-4 border-slate-200 border-t-indigo-600 mb-4"></div>
                <p class="font-bold text-xs uppercase tracking-widest">Loading orders...</p>
            </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-24">
            <div class="w-24 h-24 bg-white rounded-[2.5rem] shadow-sm border border-slate-100 flex items-center justify-center mx-auto mb-8">
                <svg class="w-10 h-10 text-slate-300" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            </div>
            <h3 class="text-2xl font-black text-slate-900 mb-2">No Orders Yet</h3>
            <p class="text-slate-500 font-medium mb-10">Looks like you haven't made any purchases yet.</p>
            <button onclick="window.location.href='/'" class="bg-slate-900 text-white px-10 py-5 rounded-[1.8rem] font-black uppercase tracking-widest text-xs hover:bg-indigo-600 transition-all shadow-xl shadow-slate-900/20">Start Shopping</button>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script>
        async function loadOrders() {
            const token = localStorage.getItem('customer_token');
            if (!token) {
                window.location.href = '/login.html';
                return;
            }

            try {
                const res = await API.get('/orders/my');
                const orders = res.data;
                const container = document.getElementById('orders-container');
                
                if (orders.length === 0) {
                    container.classList.add('hidden');
                    document.getElementById('empty-state').classList.remove('hidden');
                    return;
                }

                container.innerHTML = '';
                orders.forEach(order => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100 group hover:shadow-2xl hover:shadow-slate-200/50 transition-all duration-700 animate-in fade-in slide-in-from-bottom-6';
                    
                    const statusColors = {
                        'PLACED': 'bg-indigo-50 text-indigo-600',
                        'ACCEPTED': 'bg-blue-50 text-blue-600',
                        'READY': 'bg-amber-50 text-amber-600',
                        'DELIVERED': 'bg-green-50 text-green-600',
                        'CANCELLED': 'bg-rose-50 text-rose-600'
                    };

                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-8 pb-6 border-b border-slate-50">
                            <div>
                                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-1">Invoice</p>
                                <p class="text-lg font-black text-slate-900 tracking-tight">${order.invoiceNumber}</p>
                            </div>
                            <div class="text-right">
                                <span class="${statusColors[order.status] || 'bg-slate-50 text-slate-600'} px-4 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest">
                                    ${order.status}
                                </span>
                                <p class="text-[10px] font-black text-slate-400 mt-2 uppercase tracking-widest">${new Date(order.createdAt).toLocaleDateString()}</p>
                            </div>
                        </div>

                        <div class="space-y-4 mb-8">
                            ${order.items.map(item => `
                                <div class="flex justify-between items-center text-sm">
                                    <div class="flex flex-col">
                                        <span class="text-slate-900 font-bold">${item.name} x ${item.quantity}</span>
                                        ${item.size ? `<span class="text-[10px] font-black uppercase tracking-widest text-slate-400 mt-0.5">Size: ${item.size}</span>` : ''}
                                    </div>
                                    <span class="font-black text-slate-900">${utils.formatCurrency(item.price * item.quantity)}</span>
                                </div>
                            `).join('')}
                        </div>

                        <div class="flex items-center justify-between pt-6 border-t border-slate-50">
                            <div>
                                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Total Amount</p>
                                <p class="text-xl font-black text-slate-900 tracking-tight">${utils.formatCurrency(order.total)}</p>
                            </div>
                            <button onclick="window.location.href='/track.html?id=${order.id}'" class="bg-slate-50 text-slate-900 px-6 py-3 rounded-2xl font-black uppercase tracking-widest text-[10px] hover:bg-slate-900 hover:text-white transition-all">Track Order</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                console.error(err);
                if (err.statusCode === 401) {
                    window.location.href = '/login.html';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
