<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopOS - Modern E-commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --accent: #f43f5e;
            --bg: #fdfdfd;
            --slate-900: #0f172a;
        }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg); color: #334155; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .product-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1); }
        .skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-tab { background: var(--slate-900) !important; color: white !important; transform: scale(1.05); }
    </style>
</head>
<body class="pb-20 md:pb-0">
    <!-- Navbar -->
    <nav class="sticky top-0 z-40 glass border-b border-white/20">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div id="shop-logo" class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg">S</div>
                <h1 id="shop-name" class="text-xl font-bold tracking-tight text-slate-900">ShopOS</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="relative hidden md:block">
                    <input type="text" id="search-input" placeholder="Search products..." class="pl-10 pr-4 py-2.5 rounded-2xl bg-slate-100/50 border-none focus:ring-2 focus:ring-indigo-500 w-80 transition-all">
                    <svg class="w-5 h-5 absolute left-3 top-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <div id="auth-nav" class="flex items-center gap-4">
                    <a href="/login.html" class="text-sm font-semibold text-slate-600 hover:text-slate-900">Login</a>
                </div>
                <a href="/cart.html" class="relative p-2.5 bg-slate-100 rounded-2xl text-slate-900 hover:bg-slate-900 hover:text-white transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span class="cart-badge absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white hidden">0</span>
                </a>
            </div>
        </div>
        <!-- Mobile Search -->
        <div class="md:hidden px-4 pb-4">
            <div class="relative">
                <input type="text" id="search-input-mobile" placeholder="Search products..." class="w-full pl-10 pr-4 py-3 rounded-2xl bg-slate-100 border-none focus:ring-2 focus:ring-indigo-500">
                <svg class="w-5 h-5 absolute left-3 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="max-w-7xl mx-auto px-4 py-8">
        <div class="bg-slate-900 rounded-[2.5rem] p-10 text-white relative overflow-hidden shadow-2xl">
            <div class="relative z-10 max-w-xl">
                <span class="inline-block px-4 py-1.5 rounded-full bg-white/10 text-white text-xs font-bold uppercase tracking-widest mb-6 backdrop-blur-md">New Arrival</span>
                <h2 class="text-4xl md:text-6xl font-bold mb-6 leading-tight">Elevate Your <span class="text-indigo-400">Lifestyle</span></h2>
                <p id="shop-description" class="text-slate-400 text-lg mb-10 leading-relaxed">Experience the future of commerce with ShopOS. Curated collections for the modern individual.</p>
                <div class="flex gap-4">
                    <button class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-bold hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-600/30">Shop Now</button>
                    <button class="bg-white/10 text-white px-10 py-4 rounded-2xl font-bold hover:bg-white/20 transition-all backdrop-blur-md">Explore</button>
                </div>
            </div>
            <!-- Decorative elements -->
            <div class="absolute -right-20 -top-20 w-96 h-96 bg-indigo-600/20 rounded-full blur-[100px]"></div>
            <div class="absolute -right-10 -bottom-10 w-80 h-80 bg-rose-500/10 rounded-full blur-[80px]"></div>
        </div>
    </section>

    <!-- Categories -->
    <section class="max-w-7xl mx-auto px-4 mb-8">
        <div id="category-tabs" class="flex gap-3 overflow-x-auto pb-4 no-scrollbar">
            <button class="category-tab active-tab px-8 py-3 rounded-2xl bg-white text-slate-600 font-bold whitespace-nowrap shadow-sm border border-slate-100 transition-all hover:border-indigo-200" data-category="">All Items</button>
            <!-- Categories will be injected here -->
        </div>
    </section>

    <!-- Products Grid -->
    <section class="max-w-7xl mx-auto px-4 mb-12">
        <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-8">
            <!-- Loading Skeletons -->
            <div class="skeleton-card space-y-4">
                <div class="w-full aspect-[4/5] skeleton rounded-3xl"></div>
                <div class="h-4 w-3/4 skeleton rounded-lg"></div>
                <div class="h-4 w-1/2 skeleton rounded-lg"></div>
            </div>
        </div>
        
        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-20">
            <div class="w-24 h-24 bg-slate-50 rounded-[2rem] flex items-center justify-center mx-auto mb-6">
                <svg class="w-12 h-12 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0a2 2 0 01-2 2H6a2 2 0 01-2-2m16 0l-4 4m-8-4l-4 4"></path></svg>
            </div>
            <h3 class="text-2xl font-bold text-slate-900 mb-2">No products found</h3>
            <p class="text-slate-500">Try adjusting your search or filters</p>
        </div>
    </section>

    <!-- Bottom Nav (Mobile) -->
    <div class="md:hidden fixed bottom-6 left-4 right-4 h-20 glass rounded-[2rem] border border-white/40 shadow-2xl px-8 flex justify-between items-center z-50">
        <a href="/" class="flex flex-col items-center gap-1.5 text-slate-900 scale-110">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3L4 9v12h5v-7h6v7h5V9l-8-6z"/></svg>
            <span class="text-[9px] font-bold uppercase tracking-tighter">Shop</span>
        </a>
        <a href="/cart.html" class="flex flex-col items-center gap-1.5 text-slate-400 relative">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            <span class="text-[9px] font-bold uppercase tracking-tighter">Cart</span>
            <span class="cart-badge absolute -top-1 -right-1 bg-rose-500 text-white text-[8px] w-4.5 h-4.5 flex items-center justify-center rounded-full border-2 border-white hidden">0</span>
        </a>
        <a href="/track.html" class="flex flex-col items-center gap-1.5 text-slate-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
            <span class="text-[9px] font-bold uppercase tracking-tighter">Orders</span>
        </a>
    </div>

    <!-- Scripts -->
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/cart.js"></script>
    <script>
        let currentCategory = '';
        let searchQuery = '';

        function checkAuthState() {
            const user = JSON.parse(localStorage.getItem('customer_user') || 'null');
            const authNav = document.getElementById('auth-nav');
            if (user) {
                authNav.innerHTML = `
                    <div class="flex items-center gap-4">
                        <a href="/profile.html" class="w-11 h-11 bg-white shadow-sm border border-slate-100 rounded-2xl flex items-center justify-center text-slate-900 font-black hover:bg-slate-900 hover:text-white transition-all duration-500">
                            ${(user.name || 'U')[0].toUpperCase()}
                        </a>
                        <button onclick="logout()" class="text-[10px] font-black uppercase tracking-widest text-rose-500 hover:text-rose-600 transition-colors">Sign Out</button>
                    </div>
                `;
            }
        }

        async function logout() {
            localStorage.removeItem('customer_token');
            localStorage.removeItem('customer_user');
            window.location.reload();
        }

        async function loadShop() {
            try {
                const res = await API.get('/shop');
                const shop = res.data;
                document.title = shop.name;
                document.getElementById('shop-name').textContent = shop.name;
                document.getElementById('shop-description').textContent = shop.description;
                if (shop.logoUrl) {
                    const logoContainer = document.getElementById('shop-logo');
                    logoContainer.innerHTML = `<img src="${shop.logoUrl}" alt="${shop.name}" class="w-full h-full object-contain rounded-xl p-1">`;
                    logoContainer.classList.remove('bg-slate-900');
                    logoContainer.classList.add('bg-white', 'border', 'border-slate-100');
                }
            } catch (err) {
                console.error('Failed to load shop details');
            }
        }

        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            const emptyState = document.getElementById('empty-state');
            
            try {
                const res = await API.get(`/products?category=${currentCategory}&search=${searchQuery}`);
                const { products } = res.data;
                
                grid.innerHTML = '';
                if (products.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }
                emptyState.classList.add('hidden');

                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card group bg-white rounded-[2.5rem] p-5 shadow-sm border border-slate-100 relative hover:shadow-2xl hover:shadow-slate-200/50 transition-all duration-500';
                    
                    const hasDiscount = product.comparePrice && product.comparePrice > product.price;
                    const discountPercent = hasDiscount ? Math.round(((product.comparePrice - product.price) / product.comparePrice) * 100) : 0;

                    card.innerHTML = `
                        <a href="/product.html?id=${product.id}" class="block aspect-[4/5] rounded-[2rem] overflow-hidden mb-6 relative bg-slate-50">
                            <img src="${product.imageUrl || 'https://via.placeholder.com/400x500?text=Product'}" class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110">
                            <div class="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors duration-500"></div>
                            ${hasDiscount ? `
                                <div class="absolute top-4 left-4 bg-slate-900 text-white text-[9px] font-black px-3 py-1.5 rounded-full shadow-xl uppercase tracking-widest">
                                    -${discountPercent}%
                                </div>
                            ` : ''}
                        </a>
                        <div class="px-2 pb-2">
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <p class="text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] mb-1">${product.category || 'Essential'}</p>
                                    <h3 class="font-black text-slate-900 truncate tracking-tight group-hover:text-indigo-600 transition-colors">${product.name}</h3>
                                </div>
                            </div>
                            <div class="flex items-center justify-between mt-6">
                                <div class="flex flex-col">
                                    <span class="text-2xl font-black text-slate-900 tracking-tighter">${utils.formatCurrency(product.price)}</span>
                                    ${hasDiscount ? `<span class="text-xs text-slate-400 line-through font-bold tracking-tight">${utils.formatCurrency(product.comparePrice)}</span>` : ''}
                                </div>
                                <button onclick="Cart.add('${product.id}')" class="w-14 h-14 bg-slate-900 text-white rounded-[1.25rem] flex items-center justify-center hover:bg-indigo-600 hover:rotate-90 transition-all duration-500 shadow-xl shadow-slate-900/10 active:scale-90">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"></path></svg>
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                updateCategoryTabs(products);
            } catch (err) {
                console.error('Failed to load products');
            }
        }

        function updateCategoryTabs(products) {
            const tabsContainer = document.getElementById('category-tabs');
            const categories = [...new Set(products.map(p => p.category).filter(Boolean))];
            const existingTabs = Array.from(tabsContainer.querySelectorAll('.category-tab')).map(t => t.textContent);
            
            categories.forEach(cat => {
                if (!existingTabs.includes(cat)) {
                    const btn = document.createElement('button');
                    btn.className = 'category-tab px-8 py-3 rounded-2xl bg-white text-slate-600 font-bold whitespace-nowrap border border-slate-100 transition-all hover:border-indigo-200';
                    btn.textContent = cat;
                    btn.dataset.category = cat;
                    btn.onclick = () => filterCategory(cat, btn);
                    tabsContainer.appendChild(btn);
                }
            });
        }

        function filterCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.category-tab').forEach(t => {
                t.classList.remove('active-tab');
                t.classList.add('bg-white', 'text-slate-600');
            });
            element.classList.remove('bg-white', 'text-slate-600');
            element.classList.add('active-tab');
            loadProducts();
        }

        const handleSearch = utils.debounce((q) => {
            searchQuery = q;
            loadProducts();
        }, 400);

        document.getElementById('search-input').oninput = (e) => handleSearch(e.target.value);
        document.getElementById('search-input-mobile').oninput = (e) => handleSearch(e.target.value);

        // Initial Load
        checkAuthState();
        loadShop();
        loadProducts();
    </script>
</body>
</html>
