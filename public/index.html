<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopOS - Modern E-commerce</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .product-card:hover { transform: translateY(-5px); transition: all 0.3s ease; }
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="pb-20 md:pb-0">
    <!-- Navbar -->
    <nav class="sticky top-0 z-40 glass border-b border-white/20">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div id="shop-logo" class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl">S</div>
                <h1 id="shop-name" class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">ShopOS</h1>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="relative hidden md:block">
                    <input type="text" id="search-input" placeholder="Search products..." class="pl-10 pr-4 py-2 rounded-full bg-white border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 w-64">
                    <svg class="w-5 h-5 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <div id="auth-nav" class="flex items-center gap-4">
                    <a href="/login.html" class="text-sm font-bold text-slate-600 hover:text-indigo-600">Login</a>
                </div>
                <a href="/cart.html" class="relative p-2 text-slate-600 hover:text-indigo-600 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span class="cart-badge absolute top-0 right-0 bg-indigo-600 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full hidden">0</span>
                </a>
            </div>
        </div>
        <!-- Mobile Search -->
        <div class="md:hidden px-4 pb-3">
            <div class="relative">
                <input type="text" id="search-input-mobile" placeholder="Search products..." class="w-full pl-10 pr-4 py-2 rounded-full bg-white border border-slate-200 focus:outline-none">
                <svg class="w-5 h-5 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="max-w-7xl mx-auto px-4 py-8">
        <div class="bg-gradient-to-br from-indigo-600 to-violet-700 rounded-3xl p-8 text-white relative overflow-hidden shadow-xl">
            <div class="relative z-10 max-w-lg">
                <h2 class="text-3xl md:text-4xl font-bold mb-4">Summer Collection 2024</h2>
                <p id="shop-description" class="text-indigo-100 mb-6">Discover the latest trends in fashion and lifestyle. Quality meets elegance in every piece.</p>
                <button class="bg-white text-indigo-600 px-8 py-3 rounded-full font-bold hover:bg-indigo-50 transition-colors shadow-lg">Shop Now</button>
            </div>
            <!-- Decorative circles -->
            <div class="absolute -right-20 -top-20 w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
            <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-indigo-400/20 rounded-full blur-2xl"></div>
        </div>
    </section>

    <!-- Categories -->
    <section class="max-w-7xl mx-auto px-4 mb-8">
        <div id="category-tabs" class="flex gap-4 overflow-x-auto pb-2 no-scrollbar">
            <button class="category-tab px-6 py-2 rounded-full bg-indigo-600 text-white font-medium whitespace-nowrap shadow-md" data-category="">All Items</button>
            <!-- Categories will be injected here -->
        </div>
    </section>

    <!-- Products Grid -->
    <section class="max-w-7xl mx-auto px-4 mb-12">
        <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
            <!-- Loading Skeletons -->
            <div class="skeleton-card space-y-3">
                <div class="w-full aspect-square skeleton rounded-2xl"></div>
                <div class="h-4 w-3/4 skeleton rounded"></div>
                <div class="h-4 w-1/2 skeleton rounded"></div>
            </div>
            <!-- Repeat skeletons -->
        </div>
        
        <!-- Empty State -->
        <div id="empty-state" class="hidden text-center py-20">
            <div class="w-24 h-24 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-12 h-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0a2 2 0 01-2 2H6a2 2 0 01-2-2m16 0l-4 4m-8-4l-4 4"></path></svg>
            </div>
            <h3 class="text-xl font-bold text-slate-600">No products found</h3>
            <p class="text-slate-400">Try adjusting your search or filters</p>
        </div>
    </section>

    <!-- Bottom Nav (Mobile) -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 glass border-t border-white/20 px-6 py-3 flex justify-between items-center z-40">
        <a href="/" class="flex flex-col items-center gap-1 text-indigo-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="text-[10px] font-bold">Home</span>
        </a>
        <a href="/cart.html" class="flex flex-col items-center gap-1 text-slate-400 relative">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            <span class="text-[10px] font-bold">Cart</span>
            <span class="cart-badge absolute -top-1 -right-1 bg-indigo-600 text-white text-[8px] w-4 h-4 flex items-center justify-center rounded-full hidden">0</span>
        </a>
        <a href="/track.html" class="flex flex-col items-center gap-1 text-slate-400">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
            <span class="text-[10px] font-bold">Track</span>
        </a>
    </div>

    <!-- Scripts -->
    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/cart.js"></script>
    <script>
        let currentCategory = '';
        let searchQuery = '';

        function checkAuthState() {
            const user = JSON.parse(localStorage.getItem('customer_user') || 'null');
            const authNav = document.getElementById('auth-nav');
            if (user) {
                authNav.innerHTML = `
                    <a href="/profile.html" class="text-sm font-bold text-slate-600 hover:text-indigo-600">${user.name || 'Account'}</a>
                    <button onclick="logout()" class="text-sm font-bold text-red-500">Logout</button>
                `;
            }
        }

        async function logout() {
            localStorage.removeItem('customer_token');
            localStorage.removeItem('customer_user');
            window.location.reload();
        }

        async function loadShop() {
            try {
                const res = await API.get('/shop');
                const shop = res.data;
                document.title = shop.name;
                document.getElementById('shop-name').textContent = shop.name;
                document.getElementById('shop-description').textContent = shop.description;
                if (shop.logoUrl) {
                    const logoContainer = document.getElementById('shop-logo');
                    logoContainer.innerHTML = `<img src="${shop.logoUrl}" alt="${shop.name}" class="w-full h-full object-contain rounded-xl">`;
                    logoContainer.classList.remove('bg-indigo-600', 'text-white');
                }
            } catch (err) {
                console.error('Failed to load shop details');
            }
        }

        async function loadProducts() {
            const grid = document.getElementById('products-grid');
            const emptyState = document.getElementById('empty-state');
            
            try {
                const res = await API.get(`/products?category=${currentCategory}&search=${searchQuery}`);
                const { products } = res.data;
                
                grid.innerHTML = '';
                if (products.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }
                emptyState.classList.add('hidden');

                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card bg-white rounded-2xl p-3 shadow-sm border border-slate-100 relative';
                    
                    const hasDiscount = product.comparePrice && product.comparePrice > product.price;
                    const discountPercent = hasDiscount ? Math.round(((product.comparePrice - product.price) / product.comparePrice) * 100) : 0;

                    card.innerHTML = `
                        <a href="/product.html?id=${product.id}" class="block aspect-square rounded-xl overflow-hidden mb-3 relative">
                            <img src="${product.imageUrl || 'https://via.placeholder.com/300?text=Product+Image'}" class="w-full h-full object-cover">
                            ${hasDiscount ? `<span class="absolute top-2 left-2 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded-lg">-${discountPercent}%</span>` : ''}
                        </a>
                        <h3 class="font-semibold text-slate-800 mb-1 truncate">${product.name}</h3>
                        <p class="text-xs text-slate-400 mb-2 truncate">${product.category || 'Uncategorized'}</p>
                        <div class="flex items-center justify-between">
                            <div class="flex flex-col">
                                <span class="text-lg font-bold text-indigo-600">${utils.formatCurrency(product.price)}</span>
                                ${hasDiscount ? `<span class="text-xs text-slate-400 line-through">${utils.formatCurrency(product.comparePrice)}</span>` : ''}
                            </div>
                            <button onclick="Cart.add('${product.id}')" class="p-2 bg-indigo-50 text-indigo-600 rounded-xl hover:bg-indigo-600 hover:text-white transition-all">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                // Update category tabs if it's the first load
                updateCategoryTabs(products);
            } catch (err) {
                console.error('Failed to load products');
            }
        }

        function updateCategoryTabs(products) {
            const tabsContainer = document.getElementById('category-tabs');
            const categories = [...new Set(products.map(p => p.category).filter(Boolean))];
            
            // Keep existing "All Items" tab
            const existingTabs = Array.from(tabsContainer.querySelectorAll('.category-tab')).map(t => t.textContent);
            
            categories.forEach(cat => {
                if (!existingTabs.includes(cat)) {
                    const btn = document.createElement('button');
                    btn.className = 'category-tab px-6 py-2 rounded-full bg-white text-slate-600 font-medium whitespace-nowrap hover:bg-slate-50 transition-all border border-slate-100';
                    btn.textContent = cat;
                    btn.dataset.category = cat;
                    btn.onclick = () => filterCategory(cat, btn);
                    tabsContainer.appendChild(btn);
                }
            });
        }

        function filterCategory(category, element) {
            currentCategory = category;
            document.querySelectorAll('.category-tab').forEach(t => {
                t.classList.remove('bg-indigo-600', 'text-white', 'shadow-md');
                t.classList.add('bg-white', 'text-slate-600');
            });
            element.classList.remove('bg-white', 'text-slate-600');
            element.classList.add('bg-indigo-600', 'text-white', 'shadow-md');
            loadProducts();
        }

        const handleSearch = utils.debounce((q) => {
            searchQuery = q;
            loadProducts();
        }, 400);

        document.getElementById('search-input').oninput = (e) => handleSearch(e.target.value);
        document.getElementById('search-input-mobile').oninput = (e) => handleSearch(e.target.value);

        // Initial Load
        checkAuthState();
        loadShop();
        loadProducts();
    </script>
</body>
</html>
