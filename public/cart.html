<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - ShopOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="pb-32">
    <!-- Navbar -->
    <nav class="sticky top-0 z-40 glass border-b border-white/20">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <button onclick="history.back()" class="p-2 -ml-2 text-slate-600 hover:text-indigo-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h1 class="text-lg font-bold">Shopping Cart</h1>
            <button onclick="Cart.clear().then(() => renderCart())" class="text-sm font-medium text-red-500 hover:text-red-600">Clear</button>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <div id="cart-items" class="space-y-4">
            <!-- Items will be injected -->
        </div>

        <!-- Empty State -->
        <div id="empty-cart" class="hidden text-center py-20">
            <div class="w-24 h-24 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-12 h-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            </div>
            <h3 class="text-xl font-bold text-slate-600">Your cart is empty</h3>
            <p class="text-slate-400 mb-8">Looks like you haven't added anything yet</p>
            <a href="/" class="bg-indigo-600 text-white px-8 py-3 rounded-full font-bold shadow-lg">Start Shopping</a>
        </div>

        <!-- Summary -->
        <div id="cart-summary" class="hidden mt-8 bg-white rounded-3xl p-6 shadow-sm border border-slate-100 space-y-4">
            <div class="flex justify-between text-slate-600">
                <span>Subtotal</span>
                <span id="subtotal">₹0.00</span>
            </div>
            <div class="flex justify-between text-slate-600">
                <span>Estimated GST (18%)</span>
                <span id="gst">₹0.00</span>
            </div>
            <div class="pt-4 border-t border-slate-100 flex justify-between items-center">
                <span class="text-lg font-bold text-slate-800">Total Amount</span>
                <span id="total" class="text-2xl font-bold text-indigo-600">₹0.00</span>
            </div>
        </div>
    </div>

    <!-- Sticky Checkout Button -->
    <div id="checkout-footer" class="hidden fixed bottom-0 left-0 right-0 p-4 glass border-t border-white/20 z-40">
        <div class="max-w-4xl mx-auto">
            <a href="/checkout.html" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 transition-all flex items-center justify-center gap-3">
                Proceed to Checkout
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </a>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/cart.js"></script>
    <script>
        async function renderCart() {
            const container = document.getElementById('cart-items');
            const summary = document.getElementById('cart-summary');
            const footer = document.getElementById('checkout-footer');
            const empty = document.getElementById('empty-cart');
            
            const items = await Cart.fetch();
            
            if (items.length === 0) {
                container.innerHTML = '';
                summary.classList.add('hidden');
                footer.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            summary.classList.remove('hidden');
            footer.classList.remove('hidden');

            container.innerHTML = '';
            let subtotal = 0;

            items.forEach(item => {
                const itemTotal = parseFloat(item.price) * item.quantity;
                subtotal += itemTotal;

                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex gap-4';
                card.innerHTML = `
                    <div class="w-20 h-20 rounded-xl overflow-hidden bg-slate-50 flex-shrink-0">
                        <img src="${item.imageUrl}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-grow min-w-0">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="font-bold text-slate-800 truncate pr-4">${item.name}</h3>
                            <button onclick="removeFromCart('${item.productId}')" class="text-slate-400 hover:text-red-500">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                        <p class="text-indigo-600 font-bold mb-2">${utils.formatCurrency(item.price)}</p>
                        <div class="flex items-center gap-3">
                            <div class="flex items-center border border-slate-200 rounded-lg overflow-hidden">
                                <button onclick="updateCartQty('${item.productId}', ${item.quantity - 1})" class="px-2 py-1 hover:bg-slate-50">-</button>
                                <span class="w-8 text-center text-sm font-bold">${item.quantity}</span>
                                <button onclick="updateCartQty('${item.productId}', ${item.quantity + 1})" class="px-2 py-1 hover:bg-slate-50">+</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            const gst = subtotal * 0.18;
            const total = subtotal + gst;

            document.getElementById('subtotal').textContent = utils.formatCurrency(subtotal);
            document.getElementById('gst').textContent = utils.formatCurrency(gst);
            document.getElementById('total').textContent = utils.formatCurrency(total);
        }

        async function updateCartQty(id, qty) {
            if (qty < 1) return;
            if (qty > 20) return;
            await Cart.update(id, qty);
            renderCart();
        }

        async function removeFromCart(id) {
            await Cart.remove(id);
            renderCart();
        }

        document.addEventListener('DOMContentLoaded', renderCart);
    </script>
</body>
</html>
