<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - ShopOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --slate-900: #0f172a;
            --bg: #fdfdfd;
        }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg); color: #334155; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
    </style>
</head>
<body class="pb-32">
    <!-- Navbar -->
    <nav class="sticky top-0 z-40 glass border-b border-white/20">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center bg-slate-100 rounded-xl text-slate-900 hover:bg-slate-200 transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h1 class="text-xs font-black uppercase tracking-widest text-slate-900">Shopping Cart</h1>
            <div class="flex items-center gap-4">
                <div id="auth-nav" class="flex items-center gap-4"></div>
                <button onclick="Cart.clear().then(() => renderCart())" class="text-[10px] font-black text-rose-500 uppercase tracking-widest hover:text-rose-600 transition-colors">Clear</button>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <div id="cart-items" class="space-y-6">
            <!-- Items will be injected -->
        </div>

        <!-- Empty State -->
        <div id="empty-cart" class="hidden text-center py-20">
            <div class="w-24 h-24 bg-slate-100 rounded-[2rem] flex items-center justify-center mx-auto mb-8">
                <svg class="w-12 h-12 text-slate-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            </div>
            <h3 class="text-2xl font-black text-slate-900 mb-2">Your cart is empty</h3>
            <p class="text-slate-500 mb-10 font-medium tracking-tight">Looks like you haven't added anything yet</p>
            <a href="/" class="inline-block bg-slate-900 text-white px-12 py-4 rounded-2xl font-black uppercase tracking-widest shadow-xl shadow-slate-900/20 hover:bg-indigo-600 transition-all">Start Shopping</a>
        </div>

        <!-- Summary -->
        <div id="cart-summary" class="hidden mt-12 bg-white rounded-[2rem] p-8 shadow-sm border border-slate-100 space-y-6">
            <div class="flex justify-between text-slate-500 font-bold uppercase text-[10px] tracking-widest">
                <span>Subtotal</span>
                <span id="subtotal" class="text-slate-900 text-sm tracking-normal">₹0.00</span>
            </div>
            <div class="flex justify-between text-slate-500 font-bold uppercase text-[10px] tracking-widest">
                <span>Estimated GST (18%)</span>
                <span id="gst" class="text-slate-900 text-sm tracking-normal">₹0.00</span>
            </div>
            <div class="pt-6 border-t border-slate-100 flex justify-between items-center">
                <span class="text-sm font-black uppercase tracking-[0.2em] text-slate-400">Total Amount</span>
                <span id="total" class="text-3xl font-black text-slate-900 tracking-tighter">₹0.00</span>
            </div>
        </div>
    </div>

    <!-- Sticky Checkout Button -->
    <div id="checkout-footer" class="hidden fixed bottom-6 left-4 right-4 z-50">
        <div class="max-w-4xl mx-auto glass rounded-[2rem] p-3 border border-white/40 shadow-[0_20px_50px_rgba(0,0,0,0.2)]">
            <a href="/checkout.html" class="w-full bg-slate-900 text-white py-5 rounded-[1.5rem] font-black text-lg shadow-xl shadow-slate-900/20 hover:bg-indigo-600 active:scale-[0.98] transition-all flex items-center justify-center gap-4 uppercase tracking-widest">
                Checkout Now
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </a>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/cart.js"></script>
    <script>
        async function renderCart() {
            const container = document.getElementById('cart-items');
            const summary = document.getElementById('cart-summary');
            const footer = document.getElementById('checkout-footer');
            const empty = document.getElementById('empty-cart');
            
            const items = await Cart.fetch();
            
            if (items.length === 0) {
                container.innerHTML = '';
                summary.classList.add('hidden');
                footer.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            summary.classList.remove('hidden');
            footer.classList.remove('hidden');

            container.innerHTML = '';
            let subtotal = 0;

            items.forEach(item => {
                subtotal += parseFloat(item.price) * item.quantity;
                const card = document.createElement('div');
                card.className = 'relative bg-white rounded-[2.5rem] p-5 shadow-sm border border-slate-100 flex gap-6 group hover:shadow-xl hover:shadow-slate-200/50 transition-all duration-500 animate-in fade-in slide-in-from-bottom-4 duration-700';
                card.innerHTML = `
                    <div class="w-32 h-32 rounded-3xl overflow-hidden flex-shrink-0">
                        <img src="${item.imageUrl || '/placeholder.png'}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-1000">
                    </div>
                    <div class="flex-grow min-w-0">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <h3 class="font-bold text-slate-900 truncate pr-8 text-lg tracking-tight">${item.name}</h3>
                                ${item.metadata?.size ? `<span class="inline-block mt-1 px-3 py-1 bg-slate-100 text-[10px] font-black uppercase tracking-widest text-slate-400 rounded-lg">Size: ${item.metadata.size}</span>` : ''}
                            </div>
                            <button onclick='removeFromCart("${item.productId}", ${JSON.stringify(item.metadata)})' class="absolute top-5 right-5 w-8 h-8 flex items-center justify-center text-slate-300 hover:text-rose-500 transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                        <div class="flex items-center justify-between mt-4">
                            <p class="text-indigo-600 font-black text-xl tracking-tighter">${utils.formatCurrency(item.price)}</p>
                            <div class="flex items-center bg-slate-100 rounded-xl p-1 border border-slate-200">
                                <button onclick='updateCartQty("${item.productId}", ${item.quantity - 1}, ${JSON.stringify(item.metadata)})' class="w-8 h-8 flex items-center justify-center font-black hover:bg-white rounded-lg transition-all">-</button>
                                <span class="w-10 text-center text-sm font-black">${item.quantity}</span>
                                <button onclick='updateCartQty("${item.productId}", ${item.quantity + 1}, ${JSON.stringify(item.metadata)})' class="w-8 h-8 flex items-center justify-center font-black hover:bg-white rounded-lg transition-all">+</button>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            const gst = subtotal * 0.18;
            const total = subtotal + gst;

            document.getElementById('subtotal').textContent = utils.formatCurrency(subtotal);
            document.getElementById('gst').textContent = utils.formatCurrency(gst);
            document.getElementById('total').textContent = utils.formatCurrency(total);
        }

        async function updateCartQty(id, qty, metadata) {
            if (qty < 1) return;
            if (qty > 20) return;
            await Cart.update(id, qty, metadata);
            renderCart();
        }

        async function removeFromCart(id, metadata) {
            await Cart.remove(id, metadata);
            renderCart();
        }

        // Auth Navigation
        function updateAuthNav() {
            const authNav = document.getElementById('auth-nav');
            const token = localStorage.getItem('customer_token');

            if (token) {
                authNav.innerHTML = `
                    <a href="/my-orders.html" class="text-[10px] font-black uppercase tracking-widest text-slate-400 hover:text-indigo-600 transition-colors">My Orders</a>
                    <button onclick="logout()" class="w-10 h-10 flex items-center justify-center bg-slate-50 rounded-xl text-slate-900 hover:bg-rose-50 hover:text-rose-600 transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </button>
                `;
            } else {
                authNav.innerHTML = `
                    <a href="/login.html" class="text-[10px] font-black uppercase tracking-widest text-indigo-600 hover:text-indigo-700 transition-colors">Login</a>
                `;
            }
        }

        function logout() {
            localStorage.removeItem('customer_token');
            localStorage.removeItem('customer_user');
            window.location.reload();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
            updateAuthNav();
        });
    </script>
</body>
</html>
