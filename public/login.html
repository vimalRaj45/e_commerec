<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --slate-900: #0f172a;
            --bg: #fdfdfd;
        }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg); color: #334155; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        input { transition: all 0.3s ease; }
        input:focus { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-slate-50">
    <div class="max-w-md w-full bg-white rounded-[3rem] p-10 shadow-2xl border border-slate-100 animate-in fade-in zoom-in duration-500">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-slate-900 rounded-2xl flex items-center justify-center mx-auto mb-6 text-white text-2xl font-black">S</div>
            <h1 id="auth-title" class="text-3xl font-black text-slate-900 tracking-tight">Welcome</h1>
            <p id="auth-subtitle" class="text-slate-400 font-bold text-xs uppercase tracking-widest mt-2">Sign in to your account</p>
        </div>

        <form id="auth-form" class="space-y-6">
            <div id="name-field" class="hidden">
                <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Full Name</label>
                <input type="text" name="name" placeholder="John Doe" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 font-bold">
            </div>
            <div>
                <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Email Address</label>
                <input type="email" name="email" required placeholder="your@email.com" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 font-bold">
            </div>
            <div>
                <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 font-bold">
            </div>

            <button type="submit" id="submit-btn" class="w-full bg-slate-900 text-white py-5 rounded-[1.5rem] font-black uppercase tracking-[0.2em] text-xs shadow-xl shadow-slate-900/10 hover:bg-indigo-600 transition-all mt-4">
                Login
            </button>
        </form>

        <div class="mt-10 pt-8 border-t border-slate-50 text-center">
            <p id="toggle-text" class="text-[10px] font-black uppercase tracking-widest text-slate-400">
                New here? 
                <button onclick="toggleMode()" class="text-indigo-600 hover:text-indigo-700 ml-1">Create Account</button>
            </p>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script>
        let isLogin = true;
        const form = document.getElementById('auth-form');
        const nameField = document.getElementById('name-field');
        const submitBtn = document.getElementById('submit-btn');
        const toggleText = document.getElementById('toggle-text');

        const authTitle = document.getElementById('auth-title');
        const authSubtitle = document.getElementById('auth-subtitle');

        function toggleMode() {
            isLogin = !isLogin;
            nameField.classList.toggle('hidden');
            authTitle.textContent = isLogin ? 'Welcome' : 'Join Us';
            authSubtitle.textContent = isLogin ? 'Sign in to your account' : 'Create your shopping account';
            submitBtn.textContent = isLogin ? 'Login' : 'Register';
            toggleText.innerHTML = isLogin 
                ? `New here? <button onclick="toggleMode()" class="text-indigo-600 hover:text-indigo-700 ml-1">Create Account</button>`
                : `Already a member? <button onclick="toggleMode()" class="text-indigo-600 hover:text-indigo-700 ml-1">Login Now</button>`;
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            try {
                const endpoint = isLogin ? '/auth/login' : '/auth/customer/register';
                const res = await API.post(endpoint, data);
                
                if (isLogin) {
                    localStorage.setItem('customer_token', res.data.token);
                    localStorage.setItem('customer_user', JSON.stringify(res.data.user));
                    utils.showToast('Login successful', 'success');
                    setTimeout(() => window.location.href = '/', 1000);
                } else {
                    utils.showToast('Registration successful! Please login.', 'success');
                    toggleMode();
                }
            } catch (err) {
                utils.showToast(err.message, 'error');
            }
        };
    </script>
</body>
</html>
