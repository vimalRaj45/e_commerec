<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ShopOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --slate-900: #0f172a;
            --bg: #fdfdfd;
        }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg); color: #334155; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        input[type="text"], input[type="tel"], input[type="email"], textarea {
            transition: all 0.3s ease;
        }
        input:focus, textarea:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="pb-12">
    <!-- Navbar -->
    <nav class="sticky top-0 z-40 glass border-b border-white/20">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center bg-slate-100 rounded-xl text-slate-900 hover:bg-slate-200 transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h1 class="text-sm font-black uppercase tracking-widest text-slate-900">Checkout</h1>
            <div class="w-10"></div>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 py-10">
        <form id="checkout-form" class="grid lg:grid-cols-5 gap-10 items-start">
            <!-- Left Column: Details -->
            <div class="lg:col-span-3 space-y-8">
                <div class="bg-white rounded-[2rem] p-8 shadow-sm border border-slate-100">
                    <h2 class="text-xl font-black mb-8 flex items-center gap-3 text-slate-900 uppercase tracking-tight">
                        <div class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-900">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </div>
                        Customer Details
                    </h2>
                    
                    <div class="space-y-6">
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Full Name</label>
                            <input type="text" name="customerName" required placeholder="Enter your full name" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 font-bold">
                        </div>
                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Phone Number</label>
                                <input type="tel" name="customerPhone" required pattern="[6-9]\d{9}" placeholder="98765 43210" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 font-bold">
                            </div>
                            <div>
                                <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Email (Optional)</label>
                                <input type="email" name="customerEmail" placeholder="your@email.com" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 font-bold">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-[2rem] p-8 shadow-sm border border-slate-100">
                    <h2 class="text-xl font-black mb-8 flex items-center gap-3 text-slate-900 uppercase tracking-tight">
                        <div class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-900">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                        </div>
                        Delivery Method
                    </h2>
                    
                    <div class="flex gap-4 mb-8">
                        <label class="flex-1">
                            <input type="radio" name="deliveryType" value="DELIVERY" checked class="hidden peer">
                            <div class="text-center py-4 rounded-2xl border-2 border-slate-100 peer-checked:border-slate-900 peer-checked:bg-slate-900 peer-checked:text-white cursor-pointer font-black uppercase tracking-widest text-[10px] transition-all">Home Delivery</div>
                        </label>
                        <label class="flex-1">
                            <input type="radio" name="deliveryType" value="PICKUP" class="hidden peer">
                            <div class="text-center py-4 rounded-2xl border-2 border-slate-100 peer-checked:border-slate-900 peer-checked:bg-slate-900 peer-checked:text-white cursor-pointer font-black uppercase tracking-widest text-[10px] transition-all">Store Pickup</div>
                        </label>
                    </div>

                    <div id="address-field">
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2 ml-1">Delivery Address</label>
                        <textarea name="customerAddress" rows="3" placeholder="Flat, Street, Area, Landmark..." class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 font-bold resize-none"></textarea>
                    </div>
                </div>
            </div>

            <!-- Right Column: Summary & Payment -->
            <div class="lg:col-span-2 space-y-8 lg:sticky lg:top-28">
                <div class="bg-white rounded-[2rem] p-8 shadow-sm border border-slate-100">
                    <h2 class="text-xl font-black mb-8 text-slate-900 uppercase tracking-tight">Order Summary</h2>
                    <div id="summary-items" class="space-y-4 mb-8">
                        <!-- Summary items -->
                    </div>
                    
                    <div class="space-y-3 pt-6 border-t border-slate-100">
                        <div class="flex justify-between text-slate-500 font-bold uppercase text-[10px] tracking-widest">
                            <span>Subtotal</span>
                            <span id="subtotal" class="text-slate-900 text-sm tracking-normal">₹0.00</span>
                        </div>
                        <div class="flex justify-between text-slate-500 font-bold uppercase text-[10px] tracking-widest">
                            <span>GST (18%)</span>
                            <span id="gst" class="text-slate-900 text-sm tracking-normal">₹0.00</span>
                        </div>
                        <div class="flex justify-between items-center pt-4">
                            <span class="text-sm font-black uppercase tracking-widest text-slate-400">Total</span>
                            <span id="total" class="text-3xl font-black text-slate-900 tracking-tighter">₹0.00</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-[2rem] p-8 shadow-sm border border-slate-100">
                    <h2 class="text-xl font-black mb-8 text-slate-900 uppercase tracking-tight">Payment</h2>
                    <div class="space-y-4">
                        <label class="flex items-center gap-4 p-5 rounded-2xl border-2 border-slate-100 cursor-pointer hover:border-indigo-200 transition-all group">
                            <input type="radio" name="paymentMethod" value="ONLINE" checked class="w-5 h-5 text-indigo-600 focus:ring-indigo-500">
                            <div>
                                <p class="font-black text-slate-900 uppercase text-xs tracking-widest">Online Payment</p>
                                <p class="text-[10px] text-slate-400 font-bold">UPI, Cards, Netbanking</p>
                            </div>
                        </label>
                        <label id="cod-option" class="flex items-center gap-4 p-5 rounded-2xl border-2 border-slate-100 cursor-pointer hover:border-indigo-200 transition-all group">
                            <input type="radio" name="paymentMethod" value="COD" class="w-5 h-5 text-indigo-600 focus:ring-indigo-500">
                            <div>
                                <p class="font-black text-slate-900 uppercase text-xs tracking-widest">Cash on Delivery</p>
                                <p class="text-[10px] text-slate-400 font-bold">Pay when you receive</p>
                            </div>
                        </label>
                    </div>
                </div>

                <button type="submit" id="place-order-btn" class="w-full bg-slate-900 text-white py-6 rounded-[1.5rem] font-black text-lg shadow-2xl shadow-slate-900/20 hover:bg-indigo-600 active:scale-[0.98] transition-all flex items-center justify-center gap-4 uppercase tracking-[0.2em]">
                    Complete Order
                </button>
            </div>
        </form>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/cart.js"></script>
    <script>
        const form = document.getElementById('checkout-form');
        
        async function loadSummary() {
            const items = await Cart.fetch();
            if (items.length === 0) {
                window.location.href = '/';
                return;
            }

            const container = document.getElementById('summary-items');
            let subtotal = 0;
            
            items.forEach(item => {
                subtotal += parseFloat(item.price) * item.quantity;
                const div = document.createElement('div');
                div.className = 'flex justify-between items-start text-sm';
                div.innerHTML = `
                    <div class="flex flex-col">
                        <span class="text-slate-900 font-bold">${item.name} x ${item.quantity}</span>
                        ${item.metadata?.size ? `<span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Size: ${item.metadata.size}</span>` : ''}
                    </div>
                    <span class="font-black text-slate-900">${utils.formatCurrency(parseFloat(item.price) * item.quantity)}</span>
                `;
                container.appendChild(div);
            });

            const gst = subtotal * 0.18;
            const total = subtotal + gst;

            document.getElementById('subtotal').textContent = utils.formatCurrency(subtotal);
            document.getElementById('gst').textContent = utils.formatCurrency(gst);
            document.getElementById('total').textContent = utils.formatCurrency(total);

            // Check if COD is enabled
            const shopRes = await API.get('/shop');
            if (!shopRes.data.codEnabled) {
                document.getElementById('cod-option').classList.add('hidden');
            }
        }

        // Toggle address field
        document.querySelectorAll('input[name="deliveryType"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const addressField = document.getElementById('address-field');
                if (e.target.value === 'PICKUP') {
                    addressField.classList.add('hidden');
                    addressField.querySelector('textarea').required = false;
                } else {
                    addressField.classList.remove('hidden');
                    addressField.querySelector('textarea').required = true;
                }
            });
        });

        form.onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('place-order-btn');
            btn.disabled = true;
            btn.innerHTML = '<svg class="animate-spin h-5 w-5 mr-3" viewBox="0 0 24 24">...</svg> Processing...';

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            const cartItems = await Cart.fetch();
            data.items = cartItems.map(i => ({ 
                productId: i.productId, 
                quantity: i.quantity,
                size: i.metadata?.size
            }));

            try {
                // 1. Create Order
                const orderRes = await API.post('/orders', data);
                const order = orderRes.data;

                if (data.paymentMethod === 'ONLINE') {
                    // 2. Create Razorpay Order
                    const rpKeyRes = await API.get('/payments/razorpay-key');
                    const rpOrderRes = await API.post('/payments/create-order', { orderId: order.id });
                    
                    const options = {
                        key: rpKeyRes.data.keyId,
                        amount: rpOrderRes.data.amount,
                        currency: rpOrderRes.data.currency,
                        name: "ShopOS",
                        description: `Order #${order.invoiceNumber}`,
                        order_id: rpOrderRes.data.id,
                        handler: async function (response) {
                            try {
                                await API.post('/payments/verify', response);
                                window.location.href = `/order-confirmation.html?id=${order.id}`;
                            } catch (err) {
                                utils.showToast('Payment verification failed', 'error');
                            }
                        },
                        prefill: {
                            name: data.customerName,
                            email: data.customerEmail,
                            contact: data.customerPhone
                        },
                        theme: { color: "#4f46e5" }
                    };

                    const rzp = new Razorpay(options);
                    rzp.open();
                    rzp.on('payment.failed', function (response) {
                        utils.showToast('Payment Failed: ' + response.error.description, 'error');
                    });
                } else {
                    // COD Success
                    window.location.href = `/order-confirmation.html?id=${order.id}`;
                }
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Place Order';
                utils.showToast(err.message, 'error');
            }
        };

        loadSummary();
    </script>
</body>
</html>
