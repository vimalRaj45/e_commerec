<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ShopOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="pb-12">
    <!-- Navbar -->
    <nav class="sticky top-0 z-40 glass border-b border-white/20">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <button onclick="history.back()" class="p-2 -ml-2 text-slate-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h1 class="text-lg font-bold">Checkout</h1>
            <div class="w-10"></div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto px-4 py-8">
        <form id="checkout-form" class="grid md:grid-cols-2 gap-8">
            <!-- Customer Details -->
            <div class="space-y-6">
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        Customer Details
                    </h2>
                    
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Full Name</label>
                            <input type="text" name="customerName" required placeholder="John Doe" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Phone Number</label>
                            <input type="tel" name="customerPhone" required pattern="[6-9]\d{9}" placeholder="9876543210" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Email (Optional)</label>
                            <input type="email" name="customerEmail" placeholder="john@example.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
                    <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
                        <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        Delivery
                    </h2>
                    
                    <div class="flex gap-4 mb-6">
                        <label class="flex-1">
                            <input type="radio" name="deliveryType" value="DELIVERY" checked class="hidden peer">
                            <div class="text-center py-3 rounded-xl border border-slate-200 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:text-indigo-600 cursor-pointer font-medium transition-all">Home Delivery</div>
                        </label>
                        <label class="flex-1">
                            <input type="radio" name="deliveryType" value="PICKUP" class="hidden peer">
                            <div class="text-center py-3 rounded-xl border border-slate-200 peer-checked:border-indigo-600 peer-checked:bg-indigo-50 peer-checked:text-indigo-600 cursor-pointer font-medium transition-all">Store Pickup</div>
                        </label>
                    </div>

                    <div id="address-field">
                        <label class="block text-sm font-medium text-slate-600 mb-1">Delivery Address</label>
                        <textarea name="customerAddress" rows="3" placeholder="Flat, Street, Area..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                    </div>
                </div>
            </div>

            <!-- Order Summary & Payment -->
            <div class="space-y-6">
                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
                    <h2 class="text-xl font-bold mb-6">Order Summary</h2>
                    <div id="summary-items" class="space-y-3 mb-6">
                        <!-- Summary items -->
                    </div>
                    
                    <div class="space-y-2 pt-4 border-t border-slate-100">
                        <div class="flex justify-between text-slate-500 text-sm">
                            <span>Subtotal</span>
                            <span id="subtotal">₹0.00</span>
                        </div>
                        <div class="flex justify-between text-slate-500 text-sm">
                            <span>GST (18%)</span>
                            <span id="gst">₹0.00</span>
                        </div>
                        <div class="flex justify-between font-bold text-lg pt-2">
                            <span>Total</span>
                            <span id="total" class="text-indigo-600">₹0.00</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
                    <h2 class="text-xl font-bold mb-6">Payment Method</h2>
                    <div class="space-y-4">
                        <label class="flex items-center gap-4 p-4 rounded-2xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition-all">
                            <input type="radio" name="paymentMethod" value="ONLINE" checked class="w-5 h-5 text-indigo-600">
                            <div>
                                <p class="font-bold">Online Payment</p>
                                <p class="text-xs text-slate-400">Cards, UPI, Netbanking</p>
                            </div>
                        </label>
                        <label id="cod-option" class="flex items-center gap-4 p-4 rounded-2xl border border-slate-200 cursor-pointer hover:bg-slate-50 transition-all">
                            <input type="radio" name="paymentMethod" value="COD" class="w-5 h-5 text-indigo-600">
                            <div>
                                <p class="font-bold">Cash on Delivery</p>
                                <p class="text-xs text-slate-400">Pay when you receive</p>
                            </div>
                        </label>
                    </div>
                </div>

                <button type="submit" id="place-order-btn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                    Place Order
                </button>
            </div>
        </form>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/cart.js"></script>
    <script>
        const form = document.getElementById('checkout-form');
        
        async function loadSummary() {
            const items = await Cart.fetch();
            if (items.length === 0) {
                window.location.href = '/';
                return;
            }

            const container = document.getElementById('summary-items');
            let subtotal = 0;
            
            items.forEach(item => {
                subtotal += parseFloat(item.price) * item.quantity;
                const div = document.createElement('div');
                div.className = 'flex justify-between text-sm';
                div.innerHTML = `
                    <span class="text-slate-600">${item.name} x ${item.quantity}</span>
                    <span class="font-medium">${utils.formatCurrency(parseFloat(item.price) * item.quantity)}</span>
                `;
                container.appendChild(div);
            });

            const gst = subtotal * 0.18;
            const total = subtotal + gst;

            document.getElementById('subtotal').textContent = utils.formatCurrency(subtotal);
            document.getElementById('gst').textContent = utils.formatCurrency(gst);
            document.getElementById('total').textContent = utils.formatCurrency(total);

            // Check if COD is enabled
            const shopRes = await API.get('/shop');
            if (!shopRes.data.codEnabled) {
                document.getElementById('cod-option').classList.add('hidden');
            }
        }

        // Toggle address field
        document.querySelectorAll('input[name="deliveryType"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                const addressField = document.getElementById('address-field');
                if (e.target.value === 'PICKUP') {
                    addressField.classList.add('hidden');
                    addressField.querySelector('textarea').required = false;
                } else {
                    addressField.classList.remove('hidden');
                    addressField.querySelector('textarea').required = true;
                }
            });
        });

        form.onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('place-order-btn');
            btn.disabled = true;
            btn.innerHTML = '<svg class="animate-spin h-5 w-5 mr-3" viewBox="0 0 24 24">...</svg> Processing...';

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            
            const cartItems = await Cart.fetch();
            data.items = cartItems.map(i => ({ productId: i.productId, quantity: i.quantity }));

            try {
                // 1. Create Order
                const orderRes = await API.post('/orders', data);
                const order = orderRes.data;

                if (data.paymentMethod === 'ONLINE') {
                    // 2. Create Razorpay Order
                    const rpKeyRes = await API.get('/payments/razorpay-key');
                    const rpOrderRes = await API.post('/payments/create-order', { orderId: order.id });
                    
                    const options = {
                        key: rpKeyRes.data.keyId,
                        amount: rpOrderRes.data.amount,
                        currency: rpOrderRes.data.currency,
                        name: "ShopOS",
                        description: `Order #${order.invoiceNumber}`,
                        order_id: rpOrderRes.data.id,
                        handler: async function (response) {
                            try {
                                await API.post('/payments/verify', response);
                                window.location.href = `/order-confirmation.html?id=${order.id}`;
                            } catch (err) {
                                utils.showToast('Payment verification failed', 'error');
                            }
                        },
                        prefill: {
                            name: data.customerName,
                            email: data.customerEmail,
                            contact: data.customerPhone
                        },
                        theme: { color: "#4f46e5" }
                    };

                    const rzp = new Razorpay(options);
                    rzp.open();
                    rzp.on('payment.failed', function (response) {
                        utils.showToast('Payment Failed: ' + response.error.description, 'error');
                    });
                } else {
                    // COD Success
                    window.location.href = `/order-confirmation.html?id=${order.id}`;
                }
            } catch (err) {
                btn.disabled = false;
                btn.textContent = 'Place Order';
                utils.showToast(err.message, 'error');
            }
        };

        loadSummary();
    </script>
</body>
</html>
