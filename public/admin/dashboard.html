<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ShopOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --slate-900: #0f172a;
            --bg: #fdfdfd;
        }
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; color: #334155; }
        .sidebar { width: 280px; height: 100vh; position: fixed; left: 0; top: 0; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .main-content { margin-left: 280px; min-height: 100vh; }
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); z-index: 40; }
            .mobile-overlay.active { display: block; }
        }
        .nav-link.active { background-color: var(--slate-900); color: white; }
    </style>
</head>
<body>
    <div class="mobile-overlay" onclick="toggleSidebar()"></div>
    <!-- Sidebar -->
    <aside class="sidebar bg-white border-r border-slate-100 p-8 z-50">
        <div class="flex items-center justify-between mb-12">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white text-xl font-black">S</div>
                <div>
                    <h1 class="text-sm font-black uppercase tracking-widest text-slate-900">ShopOS</h1>
                    <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Admin Panel</p>
                </div>
            </div>
            <button class="lg:hidden text-slate-400" onclick="toggleSidebar()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <nav class="space-y-3">
            <a href="/admin/dashboard.html" class="nav-link active flex items-center gap-4 px-6 py-4 rounded-2xl font-black uppercase tracking-widest text-[10px] transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Overview
            </a>
            <a href="/admin/orders.html" class="flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-400 font-black uppercase tracking-widest text-[10px] hover:bg-slate-50 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                Orders
            </a>
            <a href="/admin/products.html" class="flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-400 font-black uppercase tracking-widest text-[10px] hover:bg-slate-50 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                Products
            </a>
            <a href="/admin/settings.html" class="flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-400 font-black uppercase tracking-widest text-[10px] hover:bg-slate-50 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                Settings
            </a>
            <div class="pt-12">
                <button onclick="logout()" class="flex items-center gap-4 px-6 py-4 rounded-2xl text-rose-500 font-black uppercase tracking-widest text-[10px] hover:bg-rose-50 transition-all w-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Sign Out
                </button>
            </div>
        </nav>
    </aside>

    <main class="main-content p-6 lg:p-12">
        <!-- Header -->
        <header class="flex justify-between items-center mb-12">
            <div>
                <h2 class="text-3xl font-black text-slate-900 tracking-tight">Overview</h2>
                <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mt-1">Real-time statistics</p>
            </div>
            <button class="lg:hidden w-12 h-12 bg-white rounded-xl shadow-sm border border-slate-100 flex items-center justify-center text-slate-900" onclick="toggleSidebar()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </header>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8 mb-12">
            <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 group hover:border-slate-900 transition-all">
                <div class="w-14 h-14 bg-slate-50 text-slate-900 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-slate-900 group-hover:text-white transition-all">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                </div>
                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Orders Today</p>
                <h3 id="stat-orders" class="text-3xl font-black text-slate-900 mt-2 tracking-tighter">0</h3>
            </div>
            <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 group hover:border-slate-900 transition-all">
                <div class="w-14 h-14 bg-slate-50 text-slate-900 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-slate-900 group-hover:text-white transition-all">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Revenue Today</p>
                <h3 id="stat-revenue" class="text-3xl font-black text-slate-900 mt-2 tracking-tighter">₹0</h3>
            </div>
            <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 group hover:border-slate-900 transition-all">
                <div class="w-14 h-14 bg-slate-50 text-slate-900 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-slate-900 group-hover:text-white transition-all">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                </div>
                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Total Products</p>
                <h3 id="stat-products" class="text-3xl font-black text-slate-900 mt-2 tracking-tighter">0</h3>
            </div>
            <div class="bg-white p-8 rounded-[2rem] shadow-sm border border-slate-100 group hover:border-rose-500 transition-all">
                <div class="w-14 h-14 bg-rose-50 text-rose-600 rounded-2xl flex items-center justify-center mb-6 group-hover:bg-rose-600 group-hover:text-white transition-all">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                </div>
                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Low Stock Items</p>
                <h3 id="stat-low-stock" class="text-3xl font-black text-slate-900 mt-2 tracking-tighter">0</h3>
            </div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-10 mb-12">
            <div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-slate-100">
                <h3 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-8">Revenue (Last 7 Days)</h3>
                <canvas id="revenueChart" height="220"></canvas>
            </div>
            <div class="bg-white p-10 rounded-[2.5rem] shadow-sm border border-slate-100">
                <h3 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-8">Recent Orders</h3>
                <div id="recent-orders" class="space-y-4">
                    <!-- Orders will be injected -->
                </div>
                <a href="/admin/orders.html" class="block w-full mt-8 py-4 bg-slate-50 rounded-2xl text-center text-slate-900 font-black uppercase tracking-widest text-[10px] hover:bg-slate-100 transition-all">View All Orders</a>
            </div>
        </div>
    </main>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/admin/js/auth-guard.js"></script>
    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('active');
            document.querySelector('.mobile-overlay').classList.toggle('active');
        }

        async function loadDashboard() {
            try {
                // Load Stats
                const statsRes = await API.get('/admin/dashboard/stats');
                const stats = statsRes.data;
                document.getElementById('stat-orders').textContent = stats.ordersToday;
                document.getElementById('stat-revenue').textContent = utils.formatCurrency(stats.revenueToday);
                document.getElementById('stat-products').textContent = stats.totalProducts;
                document.getElementById('stat-low-stock').textContent = stats.lowStockItems;

                // Load Recent Orders
                const ordersRes = await API.get('/admin/orders?limit=5');
                const ordersGrid = document.getElementById('recent-orders');
                ordersGrid.innerHTML = '';
                ordersRes.data.orders.forEach(order => {
                    const div = document.createElement('div');
                    div.className = 'flex items-center justify-between p-5 bg-slate-50 rounded-[1.5rem] border border-transparent hover:border-slate-200 transition-all group';
                    div.innerHTML = `
                        <div class="flex items-center gap-5">
                            <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center text-slate-900 shadow-sm">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                            </div>
                            <div>
                                <p class="font-black text-slate-900 tracking-tight">${order.invoiceNumber}</p>
                                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mt-0.5">${order.customerName}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-black text-slate-900 tracking-tight">${utils.formatCurrency(order.total)}</p>
                            <span class="inline-block mt-1 text-[8px] font-black px-3 py-1 rounded-full uppercase tracking-widest ${getStatusColor(order.status)}">${order.status}</span>
                        </div>
                    `;
                    ordersGrid.appendChild(div);
                });

                // Load Chart
                const chartRes = await API.get('/admin/dashboard/charts?range=7');
                const chartData = chartRes.data;
                renderChart(chartData);

            } catch (err) {
                console.error(err);
            }
        }

        function getStatusColor(status) {
            switch(status) {
                case 'PLACED': return 'bg-blue-100 text-blue-600';
                case 'ACCEPTED': return 'bg-indigo-100 text-indigo-600';
                case 'READY': return 'bg-orange-100 text-orange-600';
                case 'DELIVERED': return 'bg-green-100 text-green-600';
                case 'CANCELLED': return 'bg-red-100 text-red-600';
                default: return 'bg-slate-100 text-slate-600';
            }
        }

        function renderChart(data) {
            const ctx = document.getElementById('revenueChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: data.map(d => d.date.split('-').slice(1).join('/')),
                    datasets: [{
                        label: 'Revenue',
                        data: data.map(d => d.revenue),
                        backgroundColor: '#4f46e5',
                        borderRadius: 8,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { display: false } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        loadDashboard();
        setInterval(loadDashboard, 60000); // Refresh every minute
    </script>
</body>
</html>
