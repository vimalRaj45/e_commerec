<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ShopOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">ShopOS Admin</h1>
            <p class="text-slate-500 mt-2">Manage your store with ease</p>
        </div>

        <div class="bg-white rounded-[2.5rem] p-8 shadow-xl border border-slate-100">
            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Email Address</label>
                    <input type="email" name="email" required placeholder="owner@yourshop.com" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition-all">
                    Sign In
                </button>
            </form>

            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-100"></div></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-4 text-slate-400">Or continue with</span></div>
            </div>

            <a href="/api/auth/google" class="w-full flex items-center justify-center gap-3 px-4 py-3 border border-slate-200 rounded-xl font-bold text-slate-600 hover:bg-slate-50 transition-all mb-6">
                <img src="https://www.google.com/favicon.ico" class="w-5 h-5">
                Login with Google
            </a>

            <p class="text-center text-sm text-slate-500">
                Don't have an account? <a href="/admin/register.html" class="text-indigo-600 font-bold hover:underline">Register here</a>
            </p>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script>
        // Check for token in URL (from Google OAuth callback)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (token) {
            localStorage.setItem('admin_token', token);
            window.location.href = '/admin/dashboard.html';
        }

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const res = await API.post('/auth/login', data);
                localStorage.setItem('admin_token', res.data.token);
                window.location.href = '/admin/dashboard.html';
            } catch (err) {
                utils.showToast(err.message, 'error');
            }
        };
    </script>
</body>
</html>
