<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form - ShopOS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .drop-zone { border: 2px dashed #e2e8f0; transition: all 0.3s ease; }
        .drop-zone.active { border-color: #4f46e5; background-color: #eef2ff; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto">
        <header class="flex items-center gap-4 mb-10">
            <button onclick="history.back()" class="p-2 bg-white rounded-xl border border-slate-100 text-slate-500 hover:text-indigo-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h1 id="form-title" class="text-2xl font-bold text-slate-800">Add New Product</h1>
        </header>

        <form id="product-form" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Form Fields -->
            <div class="md:col-span-2 space-y-6">
                <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100 space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Product Name</label>
                        <input type="text" name="name" required placeholder="e.g. Premium Cotton T-Shirt" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Description</label>
                        <textarea name="description" rows="5" placeholder="Describe your product..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Price (₹)</label>
                            <input type="number" name="price" step="0.01" required placeholder="0.00" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none font-bold">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Compare Price (₹)</label>
                            <input type="number" name="comparePrice" step="0.01" placeholder="0.00" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100 space-y-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Stock Quantity</label>
                            <input type="number" name="stock" required value="0" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Category</label>
                            <input type="text" name="category" list="category-list" placeholder="Select or type..." class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                            <datalist id="category-list">
                                <option value="Fashion">
                                <option value="Electronics">
                                <option value="Home">
                                <option value="Grocery">
                            </datalist>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">HSN Code (Optional)</label>
                        <input type="text" name="hsnCode" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>
            </div>

            <!-- Image Upload -->
            <div class="space-y-6">
                <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100">
                    <h3 class="font-bold text-slate-700 mb-4">Product Images</h3>
                    <div id="drop-zone" class="drop-zone rounded-2xl p-6 text-center cursor-pointer mb-4">
                        <input type="file" id="file-input" multiple accept="image/*" class="hidden">
                        <svg class="w-10 h-10 text-slate-300 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <p class="text-xs text-slate-400">Click or drag to upload<br>(Max 5MB per image)</p>
                    </div>
                    <div id="image-previews" class="grid grid-cols-2 gap-3">
                        <!-- Previews will be added here -->
                    </div>
                </div>

                <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100 space-y-4">
                    <button type="submit" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition-all">
                        Save Product
                    </button>
                    <button type="button" onclick="history.back()" class="w-full text-slate-500 font-bold py-2">
                        Cancel
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/admin/js/auth-guard.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        const form = document.getElementById('product-form');
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('image-previews');
        
        let uploadedImages = [];

        if (productId) {
            document.getElementById('form-title').textContent = 'Edit Product';
            loadProduct();
        }

        async function loadProduct() {
            try {
                const res = await API.get(`/products/${productId}`);
                const p = res.data;
                Object.keys(p).forEach(key => {
                    if (form.elements[key]) {
                        form.elements[key].value = p[key];
                    }
                });
                if (p.imageUrl) uploadedImages.push(p.imageUrl);
                if (p.images) uploadedImages.push(...p.images);
                renderPreviews();
            } catch (err) {}
        }

        // Image Handling
        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('active'); };
        dropZone.ondragleave = () => dropZone.classList.remove('active');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            handleFiles(e.dataTransfer.files);
        };
        fileInput.onchange = (e) => handleFiles(e.target.files);

        async function handleFiles(files) {
            for (const file of files) {
                if (uploadedImages.length >= 6) break;
                
                const formData = new FormData();
                formData.append('image', file);
                
                try {
                    const token = localStorage.getItem('admin_token');
                    const res = await fetch('/api/upload/image', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    const result = await res.json();
                    if (result.success) {
                        uploadedImages.push(result.data.url);
                        renderPreviews();
                    } else {
                        utils.showToast(result.error.message, 'error');
                    }
                } catch (err) {
                    utils.showToast('Upload failed', 'error');
                }
            }
        }

        function renderPreviews() {
            previewContainer.innerHTML = '';
            uploadedImages.forEach((url, i) => {
                const div = document.createElement('div');
                div.className = 'relative aspect-square rounded-xl overflow-hidden group shadow-sm';
                div.innerHTML = `
                    <img src="${url}" class="w-full h-full object-cover">
                    <button type="button" onclick="removeImage(${i})" class="absolute top-1 right-1 bg-white rounded-full p-1 text-red-500 shadow-md opacity-0 group-hover:opacity-100 transition-all">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                    ${i === 0 ? '<span class="absolute bottom-1 left-1 bg-indigo-600 text-[8px] text-white font-bold px-2 py-0.5 rounded">PRIMARY</span>' : ''}
                `;
                previewContainer.appendChild(div);
            });
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            renderPreviews();
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            data.price = parseFloat(data.price) || 0;
            data.stock = parseInt(data.stock) || 0;
            data.comparePrice = data.comparePrice ? parseFloat(data.comparePrice) : undefined;
            
            data.imageUrl = uploadedImages[0] || '';
            data.images = uploadedImages.slice(1);

            try {
                if (productId) {
                    await API.put(`/products/${productId}`, data);
                } else {
                    await API.post('/products', data);
                }
                utils.showToast('Product saved successfully', 'success');
                setTimeout(() => window.location.href = '/admin/products.html', 1000);
            } catch (err) {
                utils.showToast(err.message, 'error');
            }
        };
    </script>
</body>
</html>
