<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form - ShopOS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --slate-900: #0f172a;
            --bg: #f8fafc;
        }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg); color: #334155; }
        .drop-zone { border: 2px dashed #e2e8f0; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); background: #fdfdfd; }
        .drop-zone.active { border-color: #4f46e5; background-color: #f5f3ff; transform: scale(1.02); }
        input[type="text"], input[type="number"], textarea {
            transition: all 0.3s ease;
        }
        input:focus, textarea:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="p-6 lg:p-12">
    <div class="max-w-5xl mx-auto">
        <header class="flex items-center gap-6 mb-12">
            <button onclick="history.back()" class="w-12 h-12 flex items-center justify-center bg-white rounded-2xl shadow-sm border border-slate-100 text-slate-900 hover:bg-slate-900 hover:text-white transition-all duration-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <div>
                <h1 id="form-title" class="text-3xl font-black text-slate-900 tracking-tight">Add New Product</h1>
                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mt-1">Product Information</p>
            </div>
        </header>

        <form id="product-form" class="grid grid-cols-1 lg:grid-cols-3 gap-10">
            <!-- Form Fields -->
            <div class="lg:col-span-2 space-y-10">
                <div class="bg-white rounded-[2.5rem] p-10 shadow-sm border border-slate-100 space-y-8">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-3 ml-1">Product Name</label>
                        <input type="text" name="name" required placeholder="e.g. Premium Cotton T-Shirt" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 font-black">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-3 ml-1">Description</label>
                        <textarea name="description" rows="6" placeholder="Describe your product details..." class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 font-bold resize-none leading-relaxed"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-8">
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-3 ml-1">Price (₹)</label>
                            <input type="number" name="price" step="0.01" required placeholder="0.00" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 outline-none font-black text-xl text-indigo-600">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-3 ml-1">Compare Price (₹)</label>
                            <input type="number" name="comparePrice" step="0.01" placeholder="0.00" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 outline-none font-bold text-slate-400">
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-[2.5rem] p-10 shadow-sm border border-slate-100 space-y-8">
                    <div class="grid grid-cols-2 gap-8">
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-3 ml-1">Stock Quantity</label>
                            <input type="number" name="stock" required value="0" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 font-black">
                        </div>
                        <div>
                            <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-3 ml-1">Category</label>
                            <input type="text" name="category" list="category-list" placeholder="Fashion, Home, etc." class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 font-black">
                            <datalist id="category-list">
                                <option value="Fashion">
                                <option value="Electronics">
                                <option value="Home">
                                <option value="Grocery">
                            </datalist>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Image Upload -->
            <div class="space-y-10">
                <div class="bg-white rounded-[2.5rem] p-10 shadow-sm border border-slate-100">
                    <h3 class="text-xs font-black uppercase tracking-widest text-slate-900 mb-6 flex items-center gap-2">
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        Product Media
                    </h3>
                    <div id="drop-zone" class="drop-zone rounded-3xl p-10 text-center cursor-pointer mb-8 border-slate-200 hover:border-indigo-600 group transition-all">
                        <input type="file" id="file-input" multiple accept="image/*" class="hidden">
                        <div class="w-16 h-16 bg-slate-50 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                            <svg class="w-8 h-8 text-slate-400 group-hover:text-indigo-600 transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"></path></svg>
                        </div>
                        <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 group-hover:text-indigo-600 transition-colors">Click or drag to upload</p>
                    </div>
                    <div id="image-previews" class="grid grid-cols-2 gap-4">
                        <!-- Previews -->
                    </div>
                </div>

                <div class="bg-white rounded-[2.5rem] p-10 shadow-sm border border-slate-100 space-y-6">
                    <h3 class="text-xs font-black uppercase tracking-widest text-slate-900 mb-2 flex items-center gap-2">
                        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 8V4m0 4h16M4 8v12a2 2 0 002 2h12a2 2 0 002-2V8M10 12h4M10 16h4"></path></svg>
                        Available Sizes
                    </h3>
                    <div class="flex flex-wrap gap-3" id="size-options">
                        <label class="cursor-pointer">
                            <input type="checkbox" name="sizes" value="XS" class="hidden peer">
                            <div class="px-5 py-3 rounded-xl border-2 border-slate-100 peer-checked:border-slate-900 peer-checked:bg-slate-900 peer-checked:text-white font-black text-xs transition-all uppercase">XS</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" name="sizes" value="S" class="hidden peer">
                            <div class="px-5 py-3 rounded-xl border-2 border-slate-100 peer-checked:border-slate-900 peer-checked:bg-slate-900 peer-checked:text-white font-black text-xs transition-all uppercase">S</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" name="sizes" value="M" class="hidden peer">
                            <div class="px-5 py-3 rounded-xl border-2 border-slate-100 peer-checked:border-slate-900 peer-checked:bg-slate-900 peer-checked:text-white font-black text-xs transition-all uppercase">M</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" name="sizes" value="L" class="hidden peer">
                            <div class="px-5 py-3 rounded-xl border-2 border-slate-100 peer-checked:border-slate-900 peer-checked:bg-slate-900 peer-checked:text-white font-black text-xs transition-all uppercase">L</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" name="sizes" value="XL" class="hidden peer">
                            <div class="px-5 py-3 rounded-xl border-2 border-slate-100 peer-checked:border-slate-900 peer-checked:bg-slate-900 peer-checked:text-white font-black text-xs transition-all uppercase">XL</div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="checkbox" name="sizes" value="XXL" class="hidden peer">
                            <div class="px-5 py-3 rounded-xl border-2 border-slate-100 peer-checked:border-slate-900 peer-checked:bg-slate-900 peer-checked:text-white font-black text-xs transition-all uppercase">XXL</div>
                        </label>
                    </div>
                </div>

                <div class="bg-white rounded-[2.5rem] p-10 shadow-sm border border-slate-100 space-y-4">
                    <button type="submit" class="w-full bg-slate-900 text-white py-5 rounded-[1.5rem] font-black text-lg shadow-xl shadow-slate-900/20 hover:bg-indigo-600 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-4 uppercase tracking-[0.2em]">
                        Save Product
                    </button>
                    <button type="button" onclick="history.back()" class="w-full text-slate-400 font-black uppercase tracking-widest text-[10px] py-4 hover:text-slate-900 transition-all">
                        Cancel Changes
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/admin/js/auth-guard.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        const form = document.getElementById('product-form');
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('image-previews');
        
        let uploadedImages = [];

        if (productId) {
            document.getElementById('form-title').textContent = 'Edit Product';
            loadProduct();
        }

        async function loadProduct() {
            try {
                const res = await API.get(`/products/${productId}`);
                const p = res.data;
                Object.keys(p).forEach(key => {
                    if (form.elements[key]) {
                        form.elements[key].value = p[key];
                    }
                });
                if (p.imageUrl) uploadedImages.push(p.imageUrl);
                if (p.images) uploadedImages.push(...p.images);
                renderPreviews();

                // Set sizes
                if (p.sizes) {
                    p.sizes.forEach(size => {
                        const cb = form.querySelector(`input[name="sizes"][value="${size}"]`);
                        if (cb) cb.checked = true;
                    });
                }
            } catch (err) {}
        }

        // Image Handling
        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('active'); };
        dropZone.ondragleave = () => dropZone.classList.remove('active');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('active');
            handleFiles(e.dataTransfer.files);
        };
        fileInput.onchange = (e) => handleFiles(e.target.files);

        async function handleFiles(files) {
            for (const file of files) {
                if (uploadedImages.length >= 4) {
                    utils.showToast('Maximum 4 images allowed', 'warning');
                    break;
                }
                
                const formData = new FormData();
                formData.append('image', file);
                
                try {
                    const token = localStorage.getItem('admin_token');
                    const res = await fetch('/api/upload/image', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    const result = await res.json();
                    if (result.success) {
                        uploadedImages.push(result.data.url);
                        renderPreviews();
                    } else {
                        utils.showToast(result.error.message, 'error');
                    }
                } catch (err) {
                    utils.showToast('Upload failed', 'error');
                }
            }
        }

        function renderPreviews() {
            previewContainer.innerHTML = '';
            uploadedImages.forEach((url, i) => {
                const div = document.createElement('div');
                div.className = 'relative aspect-square rounded-xl overflow-hidden group shadow-sm';
                div.innerHTML = `
                    <img src="${url}" class="w-full h-full object-cover">
                    <button type="button" onclick="removeImage(${i})" class="absolute top-1 right-1 bg-white rounded-full p-1 text-red-500 shadow-md opacity-0 group-hover:opacity-100 transition-all">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                    ${i === 0 ? '<span class="absolute bottom-1 left-1 bg-indigo-600 text-[8px] text-white font-bold px-2 py-0.5 rounded">PRIMARY</span>' : ''}
                `;
                previewContainer.appendChild(div);
            });
        }

        function removeImage(index) {
            uploadedImages.splice(index, 1);
            renderPreviews();
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            data.price = parseFloat(data.price) || 0;
            data.stock = parseInt(data.stock) || 0;
            data.comparePrice = data.comparePrice ? parseFloat(data.comparePrice) : undefined;
            
            data.imageUrl = uploadedImages[0] || '';
            data.images = uploadedImages.slice(1);

            // Collect sizes
            const sizeCbs = form.querySelectorAll('input[name="sizes"]:checked');
            data.sizes = Array.from(sizeCbs).map(cb => cb.value);

            try {
                if (productId) {
                    await API.put(`/products/${productId}`, data);
                } else {
                    await API.post('/products', data);
                }
                utils.showToast('Product saved successfully', 'success');
                setTimeout(() => window.location.href = '/admin/products.html', 1000);
            } catch (err) {
                utils.showToast(err.message, 'error');
            }
        };
    </script>
</body>
</html>
