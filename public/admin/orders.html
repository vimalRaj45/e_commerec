<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - ShopOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .sidebar { width: 260px; height: 100vh; position: fixed; left: 0; top: 0; }
        .main-content { margin-left: 260px; min-height: 100vh; }
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar bg-white border-r border-slate-100 p-6 z-50">
        <div class="flex items-center gap-3 mb-10">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">S</div>
            <h1 class="text-xl font-bold">ShopOS Admin</h1>
        </div>
        <nav class="space-y-2">
            <a href="/admin/dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Dashboard
            </a>
            <a href="/admin/orders.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo-50 text-indigo-600 font-bold">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                Orders
            </a>
            <a href="/admin/products.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                Products
            </a>
            <a href="/admin/settings.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-500 hover:bg-slate-50 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                Settings
            </a>
            <div class="pt-10">
                <button onclick="logout()" class="flex items-center gap-3 px-4 py-3 rounded-xl text-red-500 hover:bg-red-50 transition-all w-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Logout
                </button>
            </div>
        </nav>
    </aside>

    <main class="main-content p-6 lg:p-10">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-2xl font-bold text-slate-800">Order Management</h2>
                <p class="text-slate-500">Track and fulfill customer orders</p>
            </div>
            <div id="new-orders-badge" class="hidden animate-bounce bg-red-500 text-white px-4 py-2 rounded-full text-xs font-bold shadow-lg">New Orders!</div>
        </header>

        <!-- Filters -->
        <div class="flex gap-4 mb-8 overflow-x-auto pb-2 no-scrollbar">
            <button onclick="loadOrders('')" class="status-tab px-6 py-2 rounded-full bg-indigo-600 text-white font-bold shadow-md" data-status="">All</button>
            <button onclick="loadOrders('PLACED')" class="status-tab px-6 py-2 rounded-full bg-white text-slate-500 font-bold border border-slate-100" data-status="PLACED">New</button>
            <button onclick="loadOrders('ACCEPTED')" class="status-tab px-6 py-2 rounded-full bg-white text-slate-500 font-bold border border-slate-100" data-status="ACCEPTED">Active</button>
            <button onclick="loadOrders('DELIVERED')" class="status-tab px-6 py-2 rounded-full bg-white text-slate-500 font-bold border border-slate-100" data-status="DELIVERED">Completed</button>
        </div>

        <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Order cards will be injected -->
        </div>
    </main>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/admin/js/auth-guard.js"></script>
    <script>
        let currentStatus = '';

        async function loadOrders(status = '') {
            currentStatus = status;
            document.querySelectorAll('.status-tab').forEach(t => {
                t.classList.remove('bg-indigo-600', 'text-white', 'shadow-md');
                t.classList.add('bg-white', 'text-slate-50');
                if (t.dataset.status === status) {
                    t.classList.add('bg-indigo-600', 'text-white', 'shadow-md');
                }
            });

            try {
                const res = await API.get(`/admin/orders?status=${status}`);
                const grid = document.getElementById('orders-grid');
                grid.innerHTML = '';

                res.data.orders.forEach(order => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col h-full';
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="font-bold text-slate-800">${order.invoiceNumber}</h3>
                                <p class="text-xs text-slate-400">${utils.formatDate(order.createdAt)}</p>
                            </div>
                            <span class="text-[10px] font-bold px-3 py-1 rounded-full ${getStatusColor(order.status)}">${order.status}</span>
                        </div>
                        
                        <div class="mb-4">
                            <p class="text-sm font-bold text-slate-700">${order.customerName}</p>
                            <div class="flex items-center gap-2 mt-1">
                                <p class="text-xs text-slate-500">${order.customerPhone}</p>
                                <div class="flex gap-1">
                                    <a href="tel:${order.customerPhone}" class="p-1.5 rounded-full bg-cyan-100 text-cyan-600 hover:bg-cyan-200 transition-all">
                                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M6.62,10.79C8.06,13.62 10.38,15.94 13.21,17.38L15.41,15.18C15.69,14.9 16.08,14.82 16.43,14.93C17.55,15.3 18.75,15.5 20,15.5A1,1 0 0,1 21,16.5V20A1,1 0 0,1 20,21A17,17 0 0,1 3,4A1,1 0 0,1 4,3H7.5A1,1 0 0,1 8.5,4C8.5,5.25 8.7,6.45 9.07,7.57C9.18,7.92 9.1,8.31 8.82,8.59L6.62,10.79Z"/></svg>
                                    </a>
                                    <button onclick="contactCustomer('${order.id}', 'whatsapp')" class="p-1.5 rounded-full bg-green-100 text-green-600 hover:bg-green-200 transition-all">
                                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42 1.56 1.56 2.41 3.63 2.41 5.83 0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.39-4.19-1.15l-.3-.17-3.12.82.83-3.04-.19-.3a8.132 8.132 0 0 1-1.26-4.38c.01-4.54 3.7-8.24 8.24-8.24m-3.53 4.75c-.19 0-.51.07-.77.34-.26.27-1 1-1 2.46s1.05 2.85 1.2 3.06c.15.21 2.07 3.15 5 4.42.7.3 1.25.47 1.67.6.7.22 1.35.19 1.85.12.56-.08 1.73-.71 1.97-1.39.24-.68.24-1.27.17-1.39-.07-.12-.27-.19-.57-.34s-1.73-.85-2-1c-.27-.15-.47-.22-.67.07-.2.3-.77 1-1 1.2-.17.2-.34.22-.64.07-.3-.15-1.27-.47-2.42-1.5-.9-.8-1.5-1.78-1.67-2.08-.17-.3-.02-.46.13-.61.13-.13.3-.34.44-.51.15-.17.2-.29.3-.49.09-.2.04-.38-.02-.53-.07-.15-.67-1.62-.91-2.21-.24-.59-.47-.51-.64-.51z"/></svg>
                                    </button>
                                    <button onclick="contactCustomer('${order.id}', 'sms')" class="p-1.5 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all">
                                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M20,2H4C2.9,2,2,2.9,2,4V22L6,18H20C21.1,18,22,17.1,22,16V4C22,2.9,21.1,2,20,2M9,11H7V9H9V11M13,11H11V9H13V11M17,11H15V9H17V11Z"/></svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-2 mb-6 flex-grow">
                            ${order.items.map(i => `<div class="text-xs text-slate-500 flex justify-between"><span>${i.name} x ${i.quantity}</span><span>${utils.formatCurrency(i.price * i.quantity)}</span></div>`).join('')}
                        </div>

                        <div class="pt-4 border-t border-slate-100 flex justify-between items-center mb-6">
                            <span class="text-slate-400 text-xs font-bold uppercase">Total</span>
                            <span class="text-lg font-bold text-indigo-600">${utils.formatCurrency(order.total)}</span>
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            ${getActionButtons(order)}
                            <button onclick="downloadBill('${order.id}')" class="col-span-2 py-2 text-xs font-bold text-slate-500 border border-slate-100 rounded-xl hover:bg-slate-50 transition-all flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                                Download Bill
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                utils.showToast('Failed to load orders', 'error');
            }
        }

        function getStatusColor(status) {
            switch(status) {
                case 'PLACED': return 'bg-blue-100 text-blue-600';
                case 'ACCEPTED': return 'bg-indigo-100 text-indigo-600';
                case 'READY': return 'bg-orange-100 text-orange-600';
                case 'DELIVERED': return 'bg-green-100 text-green-600';
                case 'CANCELLED': return 'bg-red-100 text-red-600';
                default: return 'bg-slate-100 text-slate-600';
            }
        }

        function getActionButtons(order) {
            if (order.status === 'PLACED') {
                return `
                    <button onclick="updateStatus('${order.id}', 'ACCEPTED')" class="bg-indigo-600 text-white py-2 px-4 rounded-xl text-xs font-bold hover:bg-indigo-700 transition-all">Accept</button>
                    <button onclick="updateStatus('${order.id}', 'CANCELLED')" class="bg-red-50 text-red-600 py-2 px-4 rounded-xl text-xs font-bold hover:bg-red-100 transition-all">Cancel</button>
                `;
            }
            if (order.status === 'ACCEPTED') {
                return `<button onclick="updateStatus('${order.id}', 'READY')" class="col-span-2 bg-orange-500 text-white py-2 px-4 rounded-xl text-xs font-bold hover:bg-orange-600 transition-all">Mark Ready</button>`;
            }
            if (order.status === 'READY') {
                return `<button onclick="updateStatus('${order.id}', 'DELIVERED')" class="col-span-2 bg-green-600 text-white py-2 px-4 rounded-xl text-xs font-bold hover:bg-green-700 transition-all">Mark Delivered</button>`;
            }
            return '';
        }

        async function updateStatus(id, status) {
            try {
                await API.patch(`/admin/orders/${id}/status`, { status });
                utils.showToast(`Order updated to ${status}`, 'success');
                loadOrders(currentStatus);
            } catch (err) {
                utils.showToast(err.message, 'error');
            }
        }

        async function downloadBill(id) {
            const token = localStorage.getItem('admin_token');
            const response = await fetch(`/api/admin/orders/${id}/bill`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `invoice-${id}.pdf`;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        async function contactCustomer(orderId, type) {
            try {
                const res = await API.get(`/admin/orders/${orderId}`);
                const order = res.data;
                let message = '';
                
                const emojiConfetti = '%E2%9C%A8';
                const emojiTruck = '%F0%9F%9A%9A';
                const emojiBox = '%F0%9F%93%A6';
                const emojiHeart = '%E2%9D%A4%EF%B8%8F';
                const emojiSorry = '%F0%9F%98%94';
                const emojiRefund = '%F0%9F%92%B8';
                const emojiPray = '%F0%9F%99%8F';

                if (order.status === 'CANCELLED') {
                    message = `Hello *${order.customerName}*, we're sorry! ${decodeURIComponent(emojiSorry)} Your order *${order.invoiceNumber}* has been cancelled. Don't worry, your refund will be initiated within 24 hours. ${decodeURIComponent(emojiRefund)} Thank you for your patience! ${decodeURIComponent(emojiPray)}`;
                } else {
                    message = `Hi *${order.customerName}*! ${decodeURIComponent(emojiConfetti)} Good news! Your order *${order.invoiceNumber}* status is now *${order.status}*. ${decodeURIComponent(emojiTruck)} Track your package here: ${window.location.origin}/track.html?id=${order.id} ${decodeURIComponent(emojiBox)} Thank you for shopping with us! ${decodeURIComponent(emojiHeart)}`;
                }
                
                const encodedMsg = encodeURIComponent(message);
                
                if (type === 'whatsapp') {
                    window.open(`https://wa.me/${order.customerPhone}?text=${encodedMsg}`, '_blank');
                } else if (type === 'sms') {
                    window.open(`sms:${order.customerPhone}?body=${encodedMsg}`, '_blank');
                }
            } catch (err) {
                utils.showToast('Failed to generate message', 'error');
            }
        }

        // Poll for new orders
        let lastOrderCount = 0;
        async function checkNewOrders() {
            try {
                const res = await API.get('/admin/orders?status=PLACED&limit=1');
                if (res.data.total > lastOrderCount) {
                    if (lastOrderCount > 0) {
                        document.getElementById('new-orders-badge').classList.remove('hidden');
                        // Play sound
                        const audio = new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YTv5...");
                        audio.play().catch(() => {});
                    }
                    lastOrderCount = res.data.total;
                }
            } catch (err) {}
        }

        loadOrders();
        setInterval(checkNewOrders, 30000);
    </script>
</body>
</html>
