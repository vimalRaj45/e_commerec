<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - ShopOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --slate-900: #0f172a;
            --bg: #fdfdfd;
        }
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; color: #334155; }
        .sidebar { width: 280px; height: 100vh; position: fixed; left: 0; top: 0; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .main-content { margin-left: 280px; min-height: 100vh; }
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); z-index: 40; }
            .mobile-overlay.active { display: block; }
        }
        .nav-link.active { background-color: var(--slate-900); color: white; }
    </style>
</head>
<body>
    <div class="mobile-overlay" onclick="toggleSidebar()"></div>
    <!-- Sidebar -->
    <aside class="sidebar bg-white border-r border-slate-100 p-8 z-50">
        <div class="flex items-center justify-between mb-12">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white text-xl font-black">S</div>
                <div>
                    <h1 class="text-sm font-black uppercase tracking-widest text-slate-900">ShopOS</h1>
                    <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Admin Panel</p>
                </div>
            </div>
            <button class="lg:hidden text-slate-400" onclick="toggleSidebar()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <nav class="space-y-3">
            <a href="/admin/dashboard.html" class="flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-400 font-black uppercase tracking-widest text-[10px] hover:bg-slate-50 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Overview
            </a>
            <a href="/admin/orders.html" class="nav-link active flex items-center gap-4 px-6 py-4 rounded-2xl font-black uppercase tracking-widest text-[10px] transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                Orders
            </a>
            <a href="/admin/products.html" class="flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-400 font-black uppercase tracking-widest text-[10px] hover:bg-slate-50 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                Products
            </a>
            <a href="/admin/settings.html" class="flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-400 font-black uppercase tracking-widest text-[10px] hover:bg-slate-50 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                Settings
            </a>
            <div class="pt-12">
                <button onclick="logout()" class="flex items-center gap-4 px-6 py-4 rounded-2xl text-rose-500 font-black uppercase tracking-widest text-[10px] hover:bg-rose-50 transition-all w-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Sign Out
                </button>
            </div>
        </nav>
    </aside>

    <main class="main-content p-6 lg:p-12">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h2 class="text-3xl font-black text-slate-900 tracking-tight">Orders</h2>
                <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mt-1">Fulfill your orders</p>
            </div>
            <button class="lg:hidden w-12 h-12 bg-white rounded-xl shadow-sm border border-slate-100 flex items-center justify-center text-slate-900" onclick="toggleSidebar()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
            <div id="new-orders-badge" class="hidden animate-bounce bg-rose-500 text-white px-5 py-2 rounded-full text-[10px] font-black uppercase tracking-[0.2em] shadow-xl shadow-rose-500/20">New Orders!</div>
        </header>

        <!-- Filters -->
        <div class="flex gap-4 mb-12 overflow-x-auto pb-4 no-scrollbar">
            <button onclick="loadOrders('')" class="status-tab px-8 py-3 rounded-2xl bg-slate-900 text-white font-black uppercase tracking-widest text-[10px] shadow-xl shadow-slate-900/10" data-status="">All</button>
            <button onclick="loadOrders('PLACED')" class="status-tab px-8 py-3 rounded-2xl bg-white text-slate-400 font-black uppercase tracking-widest text-[10px] border border-slate-100 hover:border-slate-900 transition-all" data-status="PLACED">Pending</button>
            <button onclick="loadOrders('ACCEPTED')" class="status-tab px-8 py-3 rounded-2xl bg-white text-slate-400 font-black uppercase tracking-widest text-[10px] border border-slate-100 hover:border-slate-900 transition-all" data-status="ACCEPTED">Active</button>
            <button onclick="loadOrders('DELIVERED')" class="status-tab px-8 py-3 rounded-2xl bg-white text-slate-400 font-black uppercase tracking-widest text-[10px] border border-slate-100 hover:border-slate-900 transition-all" data-status="DELIVERED">History</button>
        </div>

        <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Order cards will be injected -->
        </div>
    </main>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/admin/js/auth-guard.js"></script>
    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('active');
            document.querySelector('.mobile-overlay').classList.toggle('active');
        }

        let currentStatus = '';

        async function loadOrders(status = '') {
            currentStatus = status;
            document.querySelectorAll('.status-tab').forEach(t => {
                t.classList.remove('bg-slate-900', 'text-white', 'shadow-xl', 'shadow-slate-900/10');
                t.classList.add('bg-white', 'text-slate-400');
                if (t.dataset.status === status) {
                    t.classList.add('bg-slate-900', 'text-white', 'shadow-xl', 'shadow-slate-900/10');
                }
            });

            try {
                const res = await API.get(`/admin/orders?status=${status}`);
                const grid = document.getElementById('orders-grid');
                grid.innerHTML = '';

                res.data.orders.forEach(order => {
                    const card = document.createElement('div');
                    card.className = 'bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100 flex flex-col h-full hover:shadow-xl transition-all duration-500 group';
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <h3 class="font-black text-slate-900 tracking-tight text-lg">${order.invoiceNumber}</h3>
                                <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mt-1">${utils.formatDate(order.createdAt)}</p>
                            </div>
                            <span class="text-[8px] font-black px-3 py-1 rounded-full uppercase tracking-widest ${getStatusColor(order.status)}">${order.status}</span>
                        </div>
                        
                        <div class="mb-8 p-5 bg-slate-50 rounded-2xl border border-slate-100">
                            <div class="flex justify-between items-center mb-3">
                                <p class="text-sm font-black text-slate-900 tracking-tight">${order.customerName}</p>
                                <div class="flex gap-2">
                                    <a href="tel:${order.customerPhone}" class="w-8 h-8 rounded-lg bg-white shadow-sm border border-slate-100 flex items-center justify-center text-slate-900 hover:bg-slate-900 hover:text-white transition-all">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
                                    </a>
                                    <button onclick="contactCustomer('${order.id}', 'whatsapp')" class="w-8 h-8 rounded-lg bg-white shadow-sm border border-slate-100 flex items-center justify-center text-emerald-600 hover:bg-emerald-600 hover:text-white transition-all">
                                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42 1.56 1.56 2.41 3.63 2.41 5.83 0 4.54-3.7 8.23-8.24 8.23-1.48 0-2.93-.39-4.19-1.15l-.3-.17-3.12.82.83-3.04-.19-.3a8.132 8.132 0 0 1-1.26-4.38c.01-4.54 3.7-8.24 8.24-8.24m-3.53 4.75c-.19 0-.51.07-.77.34-.26.27-1 1-1 2.46s1.05 2.85 1.2 3.06c.15.21 2.07 3.15 5 4.42.7.3 1.25.47 1.67.6.7.22 1.35.19 1.85.12.56-.08 1.73-.71 1.97-1.39.24-.68.24-1.27.17-1.39-.07-.12-.27-.19-.57-.34s-1.73-.85-2-1c-.27-.15-.47-.22-.67.07-.2.3-.77 1-1 1.2-.17.2-.34.22-.64.07-.3-.15-1.27-.47-2.42-1.5-.9-.8-1.5-1.78-1.67-2.08-.17-.3-.02-.46.13-.61.13-.13.3-.34.44-.51.15-.17.2-.29.3-.49.09-.2.04-.38-.02-.53-.07-.15-.67-1.62-.91-2.21-.24-.59-.47-.51-.64-.51z"/></svg>
                                    </button>
                                </div>
                            </div>
                            <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">${order.customerPhone}</p>
                        </div>

                        <div class="space-y-3 mb-8 flex-grow">
                            ${order.items.map(i => `
                                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl border border-slate-100/50">
                                    <span class="text-xs font-bold text-slate-700">${i.name} <span class="text-slate-400 ml-1">x ${i.quantity}</span></span>
                                    <span class="text-xs font-black text-slate-900">${utils.formatCurrency(i.price * i.quantity)}</span>
                                </div>
                            `).join('')}
                        </div>

                        <div class="pt-6 border-t border-slate-100 flex justify-between items-center mb-8">
                            <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Total Amount</span>
                            <span class="text-2xl font-black text-slate-900 tracking-tighter">${utils.formatCurrency(order.total)}</span>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            ${getActionButtons(order)}
                            <button onclick="downloadBill('${order.id}')" class="col-span-2 py-4 text-[10px] font-black uppercase tracking-widest text-slate-400 border border-slate-100 rounded-2xl hover:bg-slate-900 hover:text-white hover:border-slate-900 transition-all flex items-center justify-center gap-3">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                                Download Invoice
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                utils.showToast('Failed to load orders', 'error');
            }
        }

        function getStatusColor(status) {
            switch(status) {
                case 'PLACED': return 'bg-blue-100 text-blue-600';
                case 'ACCEPTED': return 'bg-indigo-100 text-indigo-600';
                case 'READY': return 'bg-orange-100 text-orange-600';
                case 'DELIVERED': return 'bg-green-100 text-green-600';
                case 'CANCELLED': return 'bg-red-100 text-red-600';
                default: return 'bg-slate-100 text-slate-600';
            }
        }

        function getActionButtons(order) {
            if (order.status === 'PLACED') {
                return `
                    <button onclick="updateStatus('${order.id}', 'ACCEPTED')" class="bg-slate-900 text-white py-4 px-6 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-indigo-600 transition-all">Accept</button>
                    <button onclick="updateStatus('${order.id}', 'CANCELLED')" class="bg-rose-50 text-rose-600 py-4 px-6 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-rose-100 transition-all">Cancel</button>
                `;
            }
            if (order.status === 'ACCEPTED') {
                return `<button onclick="updateStatus('${order.id}', 'READY')" class="col-span-2 bg-amber-500 text-white py-4 px-6 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-amber-600 transition-all">Mark Ready</button>`;
            }
            if (order.status === 'READY') {
                return `<button onclick="updateStatus('${order.id}', 'DELIVERED')" class="col-span-2 bg-emerald-600 text-white py-4 px-6 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-emerald-700 transition-all">Mark Delivered</button>`;
            }
            return '';
        }

        async function updateStatus(id, status) {
            try {
                await API.patch(`/admin/orders/${id}/status`, { status });
                utils.showToast(`Order updated to ${status}`, 'success');
                loadOrders(currentStatus);
            } catch (err) {
                utils.showToast(err.message, 'error');
            }
        }

        async function downloadBill(id) {
            const token = localStorage.getItem('admin_token');
            const response = await fetch(`/api/admin/orders/${id}/bill`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `invoice-${id}.pdf`;
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        async function contactCustomer(orderId, type) {
            try {
                const res = await API.get(`/admin/orders/${orderId}`);
                const order = res.data;
                let message = '';
                
                const emojiConfetti = '%E2%9C%A8';
                const emojiTruck = '%F0%9F%9A%9A';
                const emojiBox = '%F0%9F%93%A6';
                const emojiHeart = '%E2%9D%A4%EF%B8%8F';
                const emojiSorry = '%F0%9F%98%94';
                const emojiRefund = '%F0%9F%92%B8';
                const emojiPray = '%F0%9F%99%8F';

                if (order.status === 'CANCELLED') {
                    message = `Hello *${order.customerName}*, we're sorry! ${decodeURIComponent(emojiSorry)} Your order *${order.invoiceNumber}* has been cancelled. Don't worry, your refund will be initiated within 24 hours. ${decodeURIComponent(emojiRefund)} Thank you for your patience! ${decodeURIComponent(emojiPray)}`;
                } else {
                    message = `Hi *${order.customerName}*! ${decodeURIComponent(emojiConfetti)} Good news! Your order *${order.invoiceNumber}* status is now *${order.status}*. ${decodeURIComponent(emojiTruck)} Track your package here: ${window.location.origin}/track.html?id=${order.id} ${decodeURIComponent(emojiBox)} Thank you for shopping with us! ${decodeURIComponent(emojiHeart)}`;
                }
                
                const encodedMsg = encodeURIComponent(message);
                
                if (type === 'whatsapp') {
                    window.open(`https://wa.me/${order.customerPhone}?text=${encodedMsg}`, '_blank');
                } else if (type === 'sms') {
                    window.open(`sms:${order.customerPhone}?body=${encodedMsg}`, '_blank');
                }
            } catch (err) {
                utils.showToast('Failed to generate message', 'error');
            }
        }

        // Poll for new orders
        let lastOrderCount = 0;
        async function checkNewOrders() {
            try {
                const res = await API.get('/admin/orders?status=PLACED&limit=1');
                if (res.data.total > lastOrderCount) {
                    if (lastOrderCount > 0) {
                        document.getElementById('new-orders-badge').classList.remove('hidden');
                        // Play sound
                        const audio = new Audio("data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YTv5...");
                        audio.play().catch(() => {});
                    }
                    lastOrderCount = res.data.total;
                }
            } catch (err) {}
        }

        loadOrders();
        setInterval(checkNewOrders, 30000);
    </script>
</body>
</html>
