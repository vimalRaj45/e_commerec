<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Settings - ShopOS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --slate-900: #0f172a;
            --bg: #fdfdfd;
        }
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; color: #334155; }
        .sidebar { width: 280px; height: 100vh; position: fixed; left: 0; top: 0; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .main-content { margin-left: 280px; min-height: 100vh; }
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .mobile-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); z-index: 40; }
            .mobile-overlay.active { display: block; }
        }
        .nav-link.active { background-color: var(--slate-900); color: white; }
    </style>
</head>
<body>
    <div class="mobile-overlay" onclick="toggleSidebar()"></div>
    <!-- Sidebar -->
    <aside class="sidebar bg-white border-r border-slate-100 p-8 z-50">
        <div class="flex items-center justify-between mb-12">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 bg-slate-900 rounded-xl flex items-center justify-center text-white text-xl font-black">S</div>
                <div>
                    <h1 class="text-sm font-black uppercase tracking-widest text-slate-900">ShopOS</h1>
                    <p class="text-[10px] font-black uppercase tracking-widest text-slate-400">Admin Panel</p>
                </div>
            </div>
            <button class="lg:hidden text-slate-400" onclick="toggleSidebar()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <nav class="space-y-3">
            <a href="/admin/dashboard.html" class="flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-400 font-black uppercase tracking-widest text-[10px] hover:bg-slate-50 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                Overview
            </a>
            <a href="/admin/orders.html" class="flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-400 font-black uppercase tracking-widest text-[10px] hover:bg-slate-50 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                Orders
            </a>
            <a href="/admin/products.html" class="flex items-center gap-4 px-6 py-4 rounded-2xl text-slate-400 font-black uppercase tracking-widest text-[10px] hover:bg-slate-50 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
                Products
            </a>
            <a href="/admin/settings.html" class="nav-link active flex items-center gap-4 px-6 py-4 rounded-2xl font-black uppercase tracking-widest text-[10px] transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                Settings
            </a>
            <div class="pt-12">
                <button onclick="logout()" class="flex items-center gap-4 px-6 py-4 rounded-2xl text-rose-500 font-black uppercase tracking-widest text-[10px] hover:bg-rose-50 transition-all w-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Sign Out
                </button>
            </div>
        </nav>
    </aside>

    <main class="main-content p-6 lg:p-12">
        <header class="flex justify-between items-center mb-12">
            <div>
                <h2 class="text-3xl font-black text-slate-900 tracking-tight">Settings</h2>
                <p class="text-slate-400 font-bold text-[10px] uppercase tracking-widest mt-1">Configure your store</p>
            </div>
            <button class="lg:hidden w-12 h-12 bg-white rounded-xl shadow-sm border border-slate-100 flex items-center justify-center text-slate-900" onclick="toggleSidebar()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </header>

        <form id="settings-form" class="max-w-3xl space-y-10">
            <div class="bg-white rounded-[2.5rem] p-10 shadow-sm border border-slate-100 space-y-8">
                <h3 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 border-b border-slate-50 pb-6">Shop Identity</h3>
                
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-3 ml-1">Shop Name</label>
                    <input type="text" name="name" required placeholder="Luxury Store" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-slate-900 outline-none text-slate-900 font-bold">
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-3 ml-1">Description</label>
                    <textarea name="description" rows="3" placeholder="Describe your brand..." class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-slate-900 outline-none text-slate-900 font-bold"></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-3 ml-1">Phone Number</label>
                        <input type="tel" name="phone" placeholder="+91..." class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-slate-900 outline-none text-slate-900 font-bold">
                    </div>
                    <div>
                        <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-3 ml-1">GSTIN (Optional)</label>
                        <input type="text" name="gstin" placeholder="GST Number" class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-slate-900 outline-none text-slate-900 font-bold">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-slate-400 mb-3 ml-1">Store Address</label>
                    <textarea name="address" rows="3" placeholder="Full physical address..." class="w-full px-6 py-4 rounded-2xl bg-slate-50 border-none focus:ring-2 focus:ring-slate-900 outline-none text-slate-900 font-bold"></textarea>
                </div>
            </div>

            <div class="bg-white rounded-[2.5rem] p-10 shadow-sm border border-slate-100 space-y-8">
                <h3 class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 border-b border-slate-50 pb-6">Checkout Preferences</h3>
                
                <div class="flex items-center justify-between p-6 bg-slate-50 rounded-3xl border border-slate-100/50">
                    <div>
                        <p class="text-sm font-black text-slate-900 tracking-tight">Cash on Delivery (COD)</p>
                        <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mt-1">Accept cash at doorstep</p>
                    </div>
                    <button type="button" id="cod-toggle" class="w-14 h-7 rounded-full relative transition-all duration-300 bg-slate-200">
                        <div class="absolute top-1 left-1 w-5 h-5 rounded-full bg-white shadow-sm transition-all duration-300"></div>
                    </button>
                    <input type="hidden" name="codEnabled" value="true">
                </div>
            </div>

            <button type="submit" class="w-full md:w-auto bg-slate-900 text-white px-12 py-5 rounded-[1.5rem] font-black uppercase tracking-[0.2em] text-xs shadow-xl shadow-slate-900/10 hover:bg-indigo-600 transition-all">
                Update Settings
            </button>
        </form>
    </main>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/admin/js/auth-guard.js"></script>
    <script>
        function toggleSidebar() {
            document.querySelector('.sidebar').classList.toggle('active');
            document.querySelector('.mobile-overlay').classList.toggle('active');
        }

        const form = document.getElementById('settings-form');
        const codBtn = document.getElementById('cod-toggle');
        const codInput = form.elements['codEnabled'];

        async function loadSettings() {
            try {
                const res = await API.get('/shop');
                const shop = res.data;
                Object.keys(shop).forEach(key => {
                    if (form.elements[key]) {
                        form.elements[key].value = shop[key];
                    }
                });
                updateCODToggle(shop.codEnabled);
            } catch (err) {}
        }

        codBtn.onclick = () => {
            const current = codInput.value === 'true';
            updateCODToggle(!current);
        };

        function updateCODToggle(enabled) {
            codInput.value = enabled ? 'true' : 'false';
            if (enabled) {
                codBtn.classList.replace('bg-slate-200', 'bg-indigo-600');
                codBtn.querySelector('div').classList.add('translate-x-6');
            } else {
                codBtn.classList.replace('bg-indigo-600', 'bg-slate-200');
                codBtn.querySelector('div').classList.remove('translate-x-6');
            }
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            data.codEnabled = data.codEnabled === 'true';

            try {
                await API.put('/shop', data);
                utils.showToast('Settings saved', 'success');
            } catch (err) {
                utils.showToast(err.message, 'error');
            }
        };

        loadSettings();
    </script>
</body>
</html>
