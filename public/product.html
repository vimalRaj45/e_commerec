<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - ShopOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24">
    <!-- Navbar -->
    <nav class="sticky top-0 z-40 glass border-b border-white/20">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <button onclick="history.back()" class="p-2 -ml-2 text-slate-600 hover:text-indigo-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h1 class="text-lg font-bold">Product Details</h1>
            <a href="/cart.html" class="relative p-2 text-slate-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                <span class="cart-badge absolute top-0 right-0 bg-indigo-600 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full hidden">0</span>
            </a>
        </div>
    </nav>

    <div id="product-content" class="max-w-4xl mx-auto px-4 py-6">
        <!-- Main Grid -->
        <div class="grid md:grid-cols-2 gap-8">
            <!-- Image Gallery -->
            <div class="space-y-4">
                <div class="aspect-square rounded-3xl overflow-hidden bg-white shadow-sm">
                    <img id="main-image" src="" alt="Product" class="w-full h-full object-cover">
                </div>
                <div id="thumbnails" class="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
                    <!-- Thumbnails will be injected -->
                </div>
            </div>

            <!-- Details -->
            <div class="space-y-6">
                <div>
                    <span id="category-badge" class="bg-indigo-50 text-indigo-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Category</span>
                    <h2 id="product-name" class="text-3xl font-bold text-slate-800 mt-2">Loading...</h2>
                    <div class="flex items-baseline gap-3 mt-4">
                        <span id="product-price" class="text-2xl font-bold text-indigo-600">₹0.00</span>
                        <span id="compare-price" class="text-lg text-slate-400 line-through hidden">₹0.00</span>
                    </div>
                </div>

                <div id="stock-status" class="flex items-center gap-2 text-sm font-medium">
                    <!-- Stock status badge -->
                </div>

                <div>
                    <h3 class="font-bold text-slate-800 mb-2">Description</h3>
                    <p id="product-description" class="text-slate-600 leading-relaxed"></p>
                </div>

                <div class="flex items-center gap-4 pt-4">
                    <div class="flex items-center border border-slate-200 rounded-xl overflow-hidden">
                        <button onclick="updateQty(-1)" class="px-4 py-2 hover:bg-slate-50 transition-colors">-</button>
                        <input type="number" id="quantity" value="1" min="1" max="20" class="w-12 text-center border-none focus:ring-0 font-bold" readonly>
                        <button onclick="updateQty(1)" class="px-4 py-2 hover:bg-slate-50 transition-colors">+</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Related Products -->
        <div class="mt-16">
            <h3 class="text-xl font-bold mb-6">Related Products</h3>
            <div id="related-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <!-- Related items -->
            </div>
        </div>
    </div>

    <!-- Sticky Add to Cart (Mobile) -->
    <div class="fixed bottom-0 left-0 right-0 p-4 glass border-t border-white/20 z-40">
        <div class="max-w-4xl mx-auto">
            <button id="add-btn" onclick="addToCart()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                Add to Cart
            </button>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/cart.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        let currentProduct = null;

        async function loadProduct() {
            if (!productId) {
                window.location.href = '/';
                return;
            }

            try {
                const res = await API.get(`/products/${productId}`);
                const product = res.data;
                currentProduct = product;

                document.title = `${product.name} - ShopOS`;
                document.getElementById('product-name').textContent = product.name;
                document.getElementById('product-price').textContent = utils.formatCurrency(product.price);
                document.getElementById('product-description').textContent = product.description || 'No description available.';
                document.getElementById('category-badge').textContent = product.category || 'Uncategorized';
                
                const mainImg = document.getElementById('main-image');
                mainImg.src = product.imageUrl || 'https://via.placeholder.com/600';

                // Compare Price
                if (product.comparePrice && product.comparePrice > product.price) {
                    const compPrice = document.getElementById('compare-price');
                    compPrice.textContent = utils.formatCurrency(product.comparePrice);
                    compPrice.classList.remove('hidden');
                }

                // Stock Status
                const status = document.getElementById('stock-status');
                if (product.stock <= 0) {
                    status.innerHTML = `<span class="text-red-500">Out of Stock</span>`;
                    document.getElementById('add-btn').disabled = true;
                    document.getElementById('add-btn').classList.add('opacity-50', 'cursor-not-allowed');
                } else if (product.stock <= 5) {
                    status.innerHTML = `<span class="text-orange-500">Only ${product.stock} left in stock</span>`;
                } else {
                    status.innerHTML = `<span class="text-green-500">In Stock</span>`;
                }

                // Gallery
                const thumbnails = document.getElementById('thumbnails');
                const images = [product.imageUrl, ...(product.images || [])].filter(Boolean);
                images.forEach((img, i) => {
                    const thumb = document.createElement('img');
                    thumb.src = img;
                    thumb.className = `w-20 h-20 rounded-xl object-cover cursor-pointer border-2 ${i === 0 ? 'border-indigo-600' : 'border-transparent'}`;
                    thumb.onclick = () => {
                        mainImg.src = img;
                        thumbnails.querySelectorAll('img').forEach(t => t.classList.replace('border-indigo-600', 'border-transparent'));
                        thumb.classList.replace('border-transparent', 'border-indigo-600');
                    };
                    thumbnails.appendChild(thumb);
                });

                loadRelated(product.category);
            } catch (err) {
                console.error(err);
                utils.showToast('Product not found', 'error');
                setTimeout(() => window.location.href = '/', 2000);
            }
        }

        async function loadRelated(category) {
            if (!category) return;
            try {
                const res = await API.get(`/products?category=${category}&limit=4`);
                const grid = document.getElementById('related-grid');
                res.data.products.filter(p => p.id !== productId).forEach(p => {
                    const card = document.createElement('a');
                    card.href = `/product.html?id=${p.id}`;
                    card.className = 'bg-white p-2 rounded-2xl border border-slate-100 shadow-sm';
                    card.innerHTML = `
                        <img src="${p.imageUrl}" class="w-full aspect-square object-cover rounded-xl mb-2">
                        <h4 class="text-sm font-bold truncate">${p.name}</h4>
                        <p class="text-indigo-600 font-bold">${utils.formatCurrency(p.price)}</p>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {}
        }

        function updateQty(delta) {
            const input = document.getElementById('quantity');
            let val = parseInt(input.value) + delta;
            if (val < 1) val = 1;
            if (val > 20) val = 20;
            if (currentProduct && val > currentProduct.stock) val = currentProduct.stock;
            input.value = val;
        }

        async function addToCart() {
            const qty = parseInt(document.getElementById('quantity').value);
            const btn = document.getElementById('add-btn');
            
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                Adding...
            `;
            
            await Cart.add(productId, qty);
            
            btn.innerHTML = `
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                Added!
            `;
            btn.classList.replace('bg-indigo-600', 'bg-green-600');
            
            setTimeout(() => {
                btn.innerHTML = `
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    Add to Cart
                `;
                btn.classList.replace('bg-green-600', 'bg-indigo-600');
            }, 2000);
        }

        loadProduct();
    </script>
</body>
</html>
