<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - ShopOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --slate-900: #0f172a;
            --bg: #fdfdfd;
        }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg); color: #334155; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .size-btn.active { background-color: var(--slate-900); color: white; border-color: var(--slate-900); }
    </style>
</head>
<body class="pb-32">
    <!-- Size Chart Modal -->
    <div id="size-chart-modal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-6">
        <div class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="toggleSizeChart()"></div>
        <div class="relative bg-white rounded-[2.5rem] w-full max-w-lg p-10 shadow-2xl">
            <h2 class="text-2xl font-black text-slate-900 mb-6 uppercase tracking-tight">Size Chart</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="border-b border-slate-100">
                            <th class="py-4 font-black uppercase tracking-widest text-[10px] text-slate-400">Size</th>
                            <th class="py-4 font-black uppercase tracking-widest text-[10px] text-slate-400">Chest (in)</th>
                            <th class="py-4 font-black uppercase tracking-widest text-[10px] text-slate-400">Length (in)</th>
                        </tr>
                    </thead>
                    <tbody class="font-bold text-slate-600">
                        <tr class="border-b border-slate-50">
                            <td class="py-4">XS</td>
                            <td class="py-4">36</td>
                            <td class="py-4">26</td>
                        </tr>
                        <tr class="border-b border-slate-50">
                            <td class="py-4">S</td>
                            <td class="py-4">38</td>
                            <td class="py-4">27</td>
                        </tr>
                        <tr class="border-b border-slate-50">
                            <td class="py-4">M</td>
                            <td class="py-4">40</td>
                            <td class="py-4">28</td>
                        </tr>
                        <tr class="border-b border-slate-50">
                            <td class="py-4">L</td>
                            <td class="py-4">42</td>
                            <td class="py-4">29</td>
                        </tr>
                        <tr class="border-b border-slate-50">
                            <td class="py-4">XL</td>
                            <td class="py-4">44</td>
                            <td class="py-4">30</td>
                        </tr>
                        <tr>
                            <td class="py-4">XXL</td>
                            <td class="py-4">46</td>
                            <td class="py-4">31</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <button onclick="toggleSizeChart()" class="mt-8 w-full bg-slate-900 text-white py-4 rounded-2xl font-black uppercase tracking-widest text-xs">Close</button>
        </div>
    </div>
    <!-- Navbar -->
    <nav class="sticky top-0 z-40 glass border-b border-white/20">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <button onclick="history.back()" class="w-10 h-10 flex items-center justify-center bg-slate-100 rounded-xl text-slate-900 hover:bg-slate-200 transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h1 class="text-sm font-black uppercase tracking-widest text-slate-900">Product Details</h1>
            <a href="/cart.html" class="relative w-10 h-10 flex items-center justify-center bg-slate-100 rounded-xl text-slate-900">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                <span class="cart-badge absolute -top-1 -right-1 bg-rose-500 text-white text-[9px] font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-white hidden">0</span>
            </a>
        </div>
    </nav>

    <div id="product-content" class="max-w-5xl mx-auto px-4 py-8">
        <!-- Main Grid -->
        <div class="grid lg:grid-cols-2 gap-12 items-start">
            <!-- Image Gallery -->
            <div class="space-y-6">
                <div class="aspect-[4/5] rounded-[2.5rem] overflow-hidden bg-white shadow-2xl shadow-slate-200/50 relative group">
                    <img id="main-image" src="" alt="Product" class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                </div>
                <div id="thumbnails" class="flex gap-4 overflow-x-auto pb-4 no-scrollbar">
                    <!-- Thumbnails will be injected -->
                </div>
            </div>

            <!-- Details -->
            <div class="space-y-8 lg:sticky lg:top-28">
                <div class="space-y-4">
                    <span id="category-badge" class="bg-indigo-50 text-indigo-600 text-[10px] font-black px-4 py-1.5 rounded-xl uppercase tracking-[0.2em]">Essential</span>
                    <h2 id="product-name" class="text-4xl md:text-5xl font-black text-slate-900 tracking-tight leading-tight">Loading...</h2>
                    <div class="flex items-center gap-4">
                        <span id="product-price" class="text-3xl font-black text-slate-900 tracking-tighter">₹0.00</span>
                        <span id="compare-price" class="text-xl text-slate-400 line-through font-bold hidden tracking-tighter">₹0.00</span>
                    </div>
                </div>

                <div id="stock-status" class="flex items-center gap-2 text-xs font-black uppercase tracking-widest">
                    <!-- Stock status badge -->
                </div>

                <!-- Size Selection -->
                <div id="size-selection" class="hidden pt-6 border-t border-slate-100">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="text-xs font-black uppercase tracking-widest text-slate-400">Select Size</h3>
                        <button onclick="toggleSizeChart()" class="text-[10px] font-black uppercase tracking-widest text-indigo-600 hover:text-indigo-700 underline">Size Chart</button>
                    </div>
                    <div id="size-options" class="flex flex-wrap gap-3">
                        <!-- Sizes will be injected -->
                    </div>
                </div>

                <div class="pt-6 border-t border-slate-100">
                    <h3 class="text-xs font-black uppercase tracking-widest text-slate-400 mb-4">Description</h3>
                    <p id="product-description" class="text-slate-600 leading-relaxed text-lg font-medium"></p>
                </div>

                <div class="flex items-center gap-6 pt-6">
                    <div class="flex items-center bg-slate-100 rounded-2xl p-1.5 border border-slate-200">
                        <button onclick="updateQty(-1)" class="w-12 h-12 flex items-center justify-center font-black text-xl hover:bg-white rounded-xl transition-all">-</button>
                        <input type="number" id="quantity" value="1" min="1" max="20" class="w-16 text-center bg-transparent border-none focus:ring-0 font-black text-xl" readonly>
                        <button onclick="updateQty(1)" class="w-12 h-12 flex items-center justify-center font-black text-xl hover:bg-white rounded-xl transition-all">+</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Related Products -->
        <div class="mt-24 pt-16 border-t border-slate-100">
            <h3 class="text-2xl font-black text-slate-900 mb-8 tracking-tight">You May Also Like</h3>
            <div id="related-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6">
                <!-- Related items -->
            </div>
        </div>
    </div>

    <!-- Sticky Add to Cart (Mobile) -->
    <div class="fixed bottom-6 left-4 right-4 z-50 lg:relative lg:bottom-0 lg:left-0 lg:right-0 lg:p-0">
        <div class="max-w-4xl mx-auto glass rounded-[2rem] p-3 border border-white/40 shadow-[0_20px_50px_rgba(0,0,0,0.2)] lg:shadow-none lg:bg-transparent lg:border-none">
            <button id="add-btn" onclick="addToCart()" class="w-full bg-slate-900 text-white py-5 rounded-[1.5rem] font-black text-lg shadow-xl shadow-slate-900/20 hover:bg-indigo-600 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-4 uppercase tracking-widest">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                Add to Cart
            </button>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/cart.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get('id');
        let currentProduct = null;
        let selectedSize = null;

        function toggleSizeChart() {
            document.getElementById('size-chart-modal').classList.toggle('hidden');
        }

        async function loadProduct() {
            if (!productId) {
                window.location.href = '/';
                return;
            }

            try {
                const res = await API.get(`/products/${productId}`);
                const product = res.data;
                currentProduct = product;

                document.title = `${product.name} - ShopOS`;
                document.getElementById('product-name').textContent = product.name;
                document.getElementById('product-price').textContent = utils.formatCurrency(product.price);
                document.getElementById('product-description').textContent = product.description || 'No description available.';
                document.getElementById('category-badge').textContent = product.category || 'Uncategorized';
                
                const mainImg = document.getElementById('main-image');
                mainImg.src = product.imageUrl || 'https://via.placeholder.com/600';

                // Compare Price
                if (product.comparePrice && product.comparePrice > product.price) {
                    const compPrice = document.getElementById('compare-price');
                    compPrice.textContent = utils.formatCurrency(product.comparePrice);
                    compPrice.classList.remove('hidden');
                }

                // Stock Status
                const status = document.getElementById('stock-status');
                if (product.stock <= 0) {
                    status.innerHTML = `<span class="text-red-500">Out of Stock</span>`;
                    document.getElementById('add-btn').disabled = true;
                    document.getElementById('add-btn').classList.add('opacity-50', 'cursor-not-allowed');
                } else if (product.stock <= 5) {
                    status.innerHTML = `<span class="text-orange-500">Only ${product.stock} left in stock</span>`;
                } else {
                    status.innerHTML = `<span class="text-green-500">In Stock</span>`;
                }

                // Gallery (Limit to 4)
                const thumbnails = document.getElementById('thumbnails');
                const images = [product.imageUrl, ...(product.images || [])].filter(Boolean).slice(0, 4);
                images.forEach((img, i) => {
                    const thumb = document.createElement('img');
                    thumb.src = img;
                    thumb.className = `w-20 h-20 rounded-xl object-cover cursor-pointer border-2 ${i === 0 ? 'border-indigo-600' : 'border-transparent'}`;
                    thumb.onclick = () => {
                        mainImg.src = img;
                        thumbnails.querySelectorAll('img').forEach(t => t.classList.replace('border-indigo-600', 'border-transparent'));
                        thumb.classList.replace('border-transparent', 'border-indigo-600');
                    };
                    thumbnails.appendChild(thumb);
                });

                // Sizes
                if (product.sizes && product.sizes.length > 0) {
                    document.getElementById('size-selection').classList.remove('hidden');
                    const sizeContainer = document.getElementById('size-options');
                    product.sizes.forEach(size => {
                        const btn = document.createElement('button');
                        btn.className = 'size-btn px-6 py-3 rounded-xl border-2 border-slate-100 font-black text-xs transition-all uppercase hover:border-slate-900';
                        btn.textContent = size;
                        btn.onclick = () => {
                            selectedSize = size;
                            sizeContainer.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                            btn.classList.add('active');
                        };
                        sizeContainer.appendChild(btn);
                    });
                }

                loadRelated(product.category);
            } catch (err) {
                console.error(err);
                utils.showToast('Product not found', 'error');
                setTimeout(() => window.location.href = '/', 2000);
            }
        }

        async function loadRelated(category) {
            if (!category) return;
            try {
                const res = await API.get(`/products?category=${category}&limit=4`);
                const grid = document.getElementById('related-grid');
                res.data.products.filter(p => p.id !== productId).forEach(p => {
                    const card = document.createElement('a');
                    card.href = `/product.html?id=${p.id}`;
                    card.className = 'bg-white p-2 rounded-2xl border border-slate-100 shadow-sm';
                    card.innerHTML = `
                        <img src="${p.imageUrl}" class="w-full aspect-square object-cover rounded-xl mb-2">
                        <h4 class="text-sm font-bold truncate">${p.name}</h4>
                        <p class="text-indigo-600 font-bold">${utils.formatCurrency(p.price)}</p>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {}
        }

        function updateQty(delta) {
            const input = document.getElementById('quantity');
            let val = parseInt(input.value) + delta;
            if (val < 1) val = 1;
            if (val > 20) val = 20;
            if (currentProduct && val > currentProduct.stock) val = currentProduct.stock;
            input.value = val;
        }

        async function addToCart() {
            if (currentProduct.sizes && currentProduct.sizes.length > 0 && !selectedSize) {
                utils.showToast('Please select a size', 'warning');
                return;
            }

            const qty = parseInt(document.getElementById('quantity').value);
            const btn = document.getElementById('add-btn');
            
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                Adding...
            `;
            
            await Cart.add(productId, qty, { size: selectedSize });
            
            btn.innerHTML = `
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                Added!
            `;
            btn.classList.replace('bg-indigo-600', 'bg-green-600');
            
            setTimeout(() => {
                btn.innerHTML = `
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    Add to Cart
                `;
                btn.classList.replace('bg-green-600', 'bg-indigo-600');
            }, 2000);
        }

        loadProduct();
    </script>
</body>
</html>
