<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - ShopOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --slate-900: #0f172a;
            --bg: #fdfdfd;
        }
        body { 
            font-family: 'Outfit', sans-serif; 
            background: radial-gradient(circle at top right, #f1f5f9 0%, #ffffff 100%);
            color: #334155; 
        }
        .success-float { animation: float 3s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }
        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 2rem;
            background: var(--slate-900);
            opacity: 0.2;
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.2; }
            100% { transform: scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-[3rem] p-10 shadow-2xl border border-slate-100 text-center animate-in fade-in zoom-in duration-700">
        <div class="relative w-24 h-24 mx-auto mb-10 success-float">
            <div class="pulse-ring"></div>
            <div class="relative w-24 h-24 bg-slate-900 rounded-[2rem] flex items-center justify-center shadow-xl shadow-slate-900/20">
                <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"></path></svg>
            </div>
        </div>
        
        <h1 class="text-4xl font-black text-slate-900 mb-4 tracking-tight">Success!</h1>
        <p class="text-slate-500 mb-10 font-medium leading-relaxed">Your order has been placed and is now being processed by our team.</p>

        <div class="bg-slate-50 rounded-[2rem] p-8 mb-10 text-left space-y-5 border border-slate-100">
            <div class="flex justify-between items-center">
                <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Invoice</span>
                <span id="invoice-number" class="font-black text-slate-900">...</span>
            </div>
            <div class="flex justify-between items-center">
                <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Order ID</span>
                <span id="order-id" class="text-slate-900 text-xs font-bold truncate ml-4 max-w-[150px]">...</span>
            </div>
            <div class="pt-6 border-t border-slate-200 flex justify-between items-center">
                <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Paid Total</span>
                <span id="total-amount" class="text-2xl font-black text-slate-900 tracking-tighter">₹0.00</span>
            </div>
        </div>

        <div class="space-y-4">
            <a id="track-btn" href="#" class="block w-full bg-slate-900 text-white py-5 rounded-[1.5rem] font-black uppercase tracking-[0.2em] text-xs shadow-xl shadow-slate-900/10 hover:bg-indigo-600 hover:scale-[1.02] transition-all">
                Track Order
            </a>
            <a href="/" class="block w-full text-slate-400 py-2 font-black uppercase tracking-widest text-[10px] hover:text-slate-900 transition-all">
                Continue Shopping
            </a>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        async function loadOrder() {
            if (!orderId) return window.location.href = '/';
            
            // We can't fetch full order details without customer phone (security)
            // But we might have stored it in sessionStorage or can just show basic info
            // Let's assume we fetch track info which is public
            try {
                const res = await API.get(`/orders/track/${orderId}`);
                const order = res.data;
                document.getElementById('invoice-number').textContent = order.invoiceNumber;
                document.getElementById('order-id').textContent = orderId;
                document.getElementById('total-amount').textContent = utils.formatCurrency(order.total);
                document.getElementById('track-btn').href = `/track.html?id=${orderId}`;
                
                // Note: Tracking API doesn't return total for security, 
                // in real app we'd pass total in URL or store in session
            } catch (err) {}
        }
        loadOrder();
    </script>
</body>
</html>
