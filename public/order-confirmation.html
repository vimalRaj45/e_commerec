<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed - ShopOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-[2.5rem] p-8 shadow-xl border border-slate-100 text-center">
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
        </div>
        
        <h1 class="text-3xl font-bold text-slate-800 mb-2">Order Confirmed!</h1>
        <p class="text-slate-500 mb-8">Thank you for your purchase. Your order has been placed successfully.</p>

        <div class="bg-slate-50 rounded-2xl p-6 mb-8 text-left space-y-4">
            <div class="flex justify-between text-sm">
                <span class="text-slate-500">Invoice Number</span>
                <span id="invoice-number" class="font-bold text-slate-800">...</span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-slate-500">Order ID</span>
                <span id="order-id" class="text-slate-400 text-xs">...</span>
            </div>
            <div class="pt-4 border-t border-slate-200 flex justify-between items-center">
                <span class="text-slate-500 font-medium">Total Paid</span>
                <span id="total-amount" class="text-xl font-bold text-indigo-600">₹0.00</span>
            </div>
        </div>

        <div class="space-y-4">
            <a id="track-btn" href="#" class="block w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-indigo-700 transition-all">
                Track My Order
            </a>
            <a href="/" class="block w-full text-slate-500 py-2 font-medium hover:text-indigo-600 transition-all">
                Continue Shopping
            </a>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('id');

        async function loadOrder() {
            if (!orderId) return window.location.href = '/';
            
            // We can't fetch full order details without customer phone (security)
            // But we might have stored it in sessionStorage or can just show basic info
            // Let's assume we fetch track info which is public
            try {
                const res = await API.get(`/orders/track/${orderId}`);
                const order = res.data;
                document.getElementById('invoice-number').textContent = order.invoiceNumber;
                document.getElementById('order-id').textContent = orderId;
                document.getElementById('total-amount').textContent = utils.formatCurrency(order.total);
                document.getElementById('track-btn').href = `/track.html?id=${orderId}`;
                
                // Note: Tracking API doesn't return total for security, 
                // in real app we'd pass total in URL or store in session
            } catch (err) {}
        }
        loadOrder();
    </script>
</body>
</html>
