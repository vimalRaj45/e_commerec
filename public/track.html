<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order - ShopOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .step-active { color: #4f46e5; }
        .step-active .dot { background-color: #4f46e5; ring-color: #e0e7ff; }
        .dot { transition: all 0.5s ease; }
    </style>
</head>
<body class="pb-20">
    <nav class="sticky top-0 z-40 glass border-b border-white/20">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <button onclick="history.back()" class="p-2 -ml-2 text-slate-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h1 class="text-lg font-bold">Track Order</h1>
            <div class="w-10"></div>
        </div>
    </nav>

    <div class="max-w-xl mx-auto px-4 py-8">
        <!-- Search -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 mb-8">
            <label class="block text-sm font-medium text-slate-600 mb-2">Enter Order ID</label>
            <div class="flex gap-2">
                <input type="text" id="track-id" placeholder="Order ID..." class="flex-grow px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
                <button onclick="trackOrder()" class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700 transition-all">Track</button>
            </div>
        </div>

        <!-- Tracking Results -->
        <div id="tracking-content" class="hidden">
            <div class="bg-white rounded-3xl p-8 shadow-sm border border-slate-100 mb-6">
                <div class="flex justify-between items-start mb-10">
                    <div>
                        <p id="track-invoice" class="text-lg font-bold text-slate-800">INV-0000</p>
                        <p class="text-sm text-slate-400">Invoice Number</p>
                    </div>
                    <div class="text-right">
                        <p id="track-total" class="text-lg font-bold text-indigo-600">₹0.00</p>
                        <p class="text-sm text-slate-400">Total Amount</p>
                    </div>
                </div>

                <!-- Vertical Stepper -->
                <div class="relative space-y-12 pl-10">
                    <div class="absolute left-4 top-2 bottom-2 w-0.5 bg-slate-100"></div>
                    
                    <div id="step-PLACED" class="relative text-slate-400">
                        <div class="dot absolute -left-[27px] top-1 w-4 h-4 rounded-full bg-slate-200 ring-4 ring-white"></div>
                        <h4 class="font-bold">Order Placed</h4>
                        <p class="text-xs">We have received your order</p>
                    </div>

                    <div id="step-ACCEPTED" class="relative text-slate-400">
                        <div class="dot absolute -left-[27px] top-1 w-4 h-4 rounded-full bg-slate-200 ring-4 ring-white"></div>
                        <h4 class="font-bold">Order Accepted</h4>
                        <p class="text-xs">The shop has accepted your order</p>
                    </div>

                    <div id="step-READY" class="relative text-slate-400">
                        <div class="dot absolute -left-[27px] top-1 w-4 h-4 rounded-full bg-slate-200 ring-4 ring-white"></div>
                        <h4 class="font-bold">Ready for Delivery/Pickup</h4>
                        <p class="text-xs">Your items are packed and ready</p>
                    </div>

                    <div id="step-DELIVERED" class="relative text-slate-400">
                        <div class="dot absolute -left-[27px] top-1 w-4 h-4 rounded-full bg-slate-200 ring-4 ring-white"></div>
                        <h4 class="font-bold">Delivered</h4>
                        <p class="text-xs">Order has been successfully delivered</p>
                    </div>
                </div>
            </div>

            <!-- Cancelled State -->
            <div id="cancelled-alert" class="hidden bg-red-50 text-red-600 p-4 rounded-2xl font-bold text-center border border-red-100">
                This order has been cancelled.
            </div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const initialId = urlParams.get('id');
        if (initialId) {
            document.getElementById('track-id').value = initialId;
            setTimeout(trackOrder, 100);
        }

        async function trackOrder() {
            const id = document.getElementById('track-id').value.trim();
            if (!id) return;

            try {
                const res = await API.get(`/orders/track/${id}`);
                const data = res.data;
                
                document.getElementById('tracking-content').classList.remove('hidden');
                document.getElementById('track-invoice').textContent = data.invoiceNumber;
                document.getElementById('track-total').textContent = utils.formatCurrency(data.total);
                
                const statusOrder = ['PLACED', 'ACCEPTED', 'READY', 'DELIVERED'];
                const currentStatus = data.status;

                if (currentStatus === 'CANCELLED') {
                    document.getElementById('cancelled-alert').classList.remove('hidden');
                    statusOrder.forEach(s => document.getElementById(`step-${s}`).classList.add('opacity-30'));
                } else {
                    document.getElementById('cancelled-alert').classList.add('hidden');
                    const currentIndex = statusOrder.indexOf(currentStatus);
                    
                    statusOrder.forEach((s, i) => {
                        const el = document.getElementById(`step-${s}`);
                        el.classList.remove('opacity-30');
                        if (i <= currentIndex) {
                            el.classList.add('step-active');
                        } else {
                            el.classList.remove('step-active');
                        }
                    });
                }
            } catch (err) {
                utils.showToast('Order not found', 'error');
            }
        }
    </script>
</body>
</html>
