<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - ShopOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="pb-20">
    <nav class="sticky top-0 z-40 bg-white border-b border-slate-100">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <button onclick="location.href='/'" class="p-2 -ml-2 text-slate-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <h1 class="text-lg font-bold">My Account</h1>
            <div class="w-10"></div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-white rounded-[2.5rem] p-8 shadow-sm border border-slate-100 mb-8">
            <div class="flex items-center gap-4">
                <div class="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center text-indigo-600 text-2xl font-bold">
                    <span id="user-initial">U</span>
                </div>
                <div>
                    <h2 id="user-name" class="text-2xl font-bold text-slate-800">User Name</h2>
                    <p id="user-email" class="text-slate-500">user@example.com</p>
                </div>
            </div>
        </div>

        <h3 class="text-xl font-bold text-slate-800 mb-6">Order History</h3>
        <div id="orders-list" class="space-y-4">
            <!-- Orders will be injected -->
        </div>
    </main>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script>
        const token = localStorage.getItem('customer_token');
        const user = JSON.parse(localStorage.getItem('customer_user') || 'null');

        if (!token || !user) window.location.href = '/login.html';

        document.getElementById('user-name').textContent = user.name || 'Account';
        document.getElementById('user-email').textContent = user.email;
        document.getElementById('user-initial').textContent = (user.name || 'U')[0].toUpperCase();

        async function loadOrders() {
            try {
                // Set the token for API requests
                API.token = token;
                const res = await API.get('/orders/my');
                const list = document.getElementById('orders-list');
                
                if (res.data.length === 0) {
                    list.innerHTML = `<p class="text-center py-10 text-slate-400">No orders found</p>`;
                    return;
                }

                res.data.forEach(order => {
                    const div = document.createElement('div');
                    div.className = 'bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex items-center justify-between';
                    div.innerHTML = `
                        <div>
                            <p class="font-bold text-slate-800">${order.invoiceNumber}</p>
                            <p class="text-xs text-slate-400">${utils.formatDate(order.createdAt)}</p>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-indigo-600">${utils.formatCurrency(order.total)}</p>
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full uppercase ${getStatusColor(order.status)}">${order.status}</span>
                        </div>
                        <a href="/track.html?id=${order.id}" class="p-2 text-slate-400 hover:text-indigo-600">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </a>
                    `;
                    list.appendChild(div);
                });
            } catch (err) {
                console.error(err);
            }
        }

        function getStatusColor(status) {
            switch(status) {
                case 'PLACED': return 'bg-blue-50 text-blue-600';
                case 'ACCEPTED': return 'bg-indigo-50 text-indigo-600';
                case 'READY': return 'bg-orange-50 text-orange-600';
                case 'DELIVERED': return 'bg-green-50 text-green-600';
                case 'CANCELLED': return 'bg-red-50 text-red-600';
                default: return 'bg-slate-50 text-slate-600';
            }
        }

        loadOrders();
    </script>
</body>
</html>
